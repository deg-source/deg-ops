<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stock &amp; costing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:inherit}
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --font:"Archivo",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
  --bg:#E7EBED;
  --surface:#FFFFFF;
  --surface-2:#F3F5F6;
  --ink:#19232A;
  --ink-2:#526068;
  --ink-3:#86939A;
  --rule:#CDD5D9;
  --rule-2:#E2E7E9;
  --tape:#EAD27F;
  --tape-ink:#4A3C0B;
  --ok:#2A7439;
  --warn:#9A5F0C;
  --bad:#B3261E;
  --bad-bg:#FBE7E4;
  --warn-bg:#FBF0DA;
  --ok-bg:#E3F1E5;
  --focus:#2B63A8;
  --scrim:rgba(12,18,22,.46);
  --seg-ingr:#19232A;
  --seg-buf:#5A6870;
  --seg-pack:#8C99A0;
  --seg-labor:#B7621F;
  --seg-over:#D9A15B;
  --seg-deliv:#2B63A8;
  --seg-comm:#7EA6D6;
  --seg-profit:#2A7439;
  --seg-vat:#C6CFD3;
  --seg-round:#E6EAEC;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11171A;--surface:#1A2226;--surface-2:#20292E;--ink:#E3E9EB;--ink-2:#A2AFB5;--ink-3:#75848B;
    --rule:#2F3A40;--rule-2:#252F34;--tape:#6A591B;--tape-ink:#F7E8B2;--ok:#7CC68A;--warn:#E3AE5A;--bad:#F08A80;
    --bad-bg:#3A1F1C;--warn-bg:#35291A;--ok-bg:#1B3122;--focus:#7EA6D6;--scrim:rgba(0,0,0,.6);
    --seg-ingr:#E3E9EB;--seg-buf:#A2AFB5;--seg-pack:#6E7C83;--seg-vat:#3A464C;--seg-round:#2A3439;--seg-profit:#5DB26D;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11171A;--surface:#1A2226;--surface-2:#20292E;--ink:#E3E9EB;--ink-2:#A2AFB5;--ink-3:#75848B;
  --rule:#2F3A40;--rule-2:#252F34;--tape:#6A591B;--tape-ink:#F7E8B2;--ok:#7CC68A;--warn:#E3AE5A;--bad:#F08A80;
  --bad-bg:#3A1F1C;--warn-bg:#35291A;--ok-bg:#1B3122;--focus:#7EA6D6;--scrim:rgba(0,0,0,.6);
  --seg-ingr:#E3E9EB;--seg-buf:#A2AFB5;--seg-pack:#6E7C83;--seg-vat:#3A464C;--seg-round:#2A3439;--seg-profit:#5DB26D;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;min-height:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- shell ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--rule)}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}
.top-row{display:flex;align-items:center;gap:12px;height:54px}
.brand{display:flex;align-items:center;gap:10px;font-weight:750;font-stretch:112.5%;font-size:17px;letter-spacing:-.005em;white-space:nowrap}
.mark{display:grid;grid-template-columns:repeat(4,4px);gap:2px;height:18px}
.mark i{display:block;border-radius:1px}
.mark i:nth-child(1){background:#C4352B}.mark i:nth-child(2){background:#E0B12A}.mark i:nth-child(3){background:#2B63A8}.mark i:nth-child(4){background:#2F7D3B}
.spacer{flex:1}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.who img{width:26px;height:26px;border-radius:50%;display:block}
.sync{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--rule);background:var(--surface);font-size:13px;font-weight:600;font-stretch:87.5%;cursor:pointer;white-space:nowrap}
.sync .dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.sync[data-mode="live"] .dot{background:var(--ok)}
.sync[data-mode="saving"] .dot{background:var(--focus);animation:pulse 1s infinite}
.sync[data-mode="offline"]{background:var(--tape);border-color:var(--tape);color:var(--tape-ink)}
.sync[data-mode="offline"] .dot{background:var(--tape-ink)}
.sync[data-mode="error"] .dot{background:var(--bad)}
@keyframes pulse{50%{opacity:.3}}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -4px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:10px 12px 11px;font-size:14px;font-weight:600;color:var(--ink-2);cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;border-radius:0}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink)}
main{padding:22px 0 80px}
main:focus{outline:none}

/* ---------- type ---------- */
h1{font-size:28px;line-height:1.15;font-weight:750;font-stretch:112.5%;letter-spacing:-.012em;margin:0}
h2{font-size:18px;line-height:1.3;font-weight:700;margin:0}
h3{font-size:15px;font-weight:700;margin:0}
p{margin:0}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.tnum{font-variant-numeric:tabular-nums}
.cond{font-stretch:87.5%}

/* ---------- page head ---------- */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.head .sub{margin-top:4px;color:var(--ink-2);font-size:14px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar .search{flex:1 1 220px;max-width:340px}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--ink-2);font-weight:600;font-size:14px;padding:4px 0;margin-bottom:10px;cursor:pointer}
.back:hover{color:var(--ink)}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 14px;border-radius:6px;border:1px solid var(--ink);background:var(--ink);color:var(--surface);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{filter:brightness(1.15)}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--rule)}
.btn.ghost:hover{border-color:var(--ink-3);filter:none}
.btn.quiet{background:transparent;border-color:transparent;color:var(--ink-2);padding:0 8px}
.btn.quiet:hover{color:var(--ink);filter:none}
.btn.danger{background:var(--surface);color:var(--bad);border-color:var(--rule)}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn svg{width:16px;height:16px;flex:none}
.icon-btn{width:34px;height:34px;display:inline-grid;place-items:center;border:1px solid transparent;background:none;border-radius:6px;cursor:pointer;color:var(--ink-2);flex:none}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn svg{width:18px;height:18px}
input[type=text],input[type=search],input[type=date],input[type=month],input[type=number],input:not([type]),select,textarea{
  height:40px;border:1px solid var(--rule);border-radius:6px;background:var(--surface);padding:0 10px;font-size:15px;width:100%;min-width:0}
textarea{height:auto;padding:8px 10px;min-height:70px;resize:vertical}
select{padding-right:28px;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);background-position:calc(100% - 15px) 17px,calc(100% - 10px) 17px;background-size:5px 5px;background-repeat:no-repeat}
input:focus,select:focus,textarea:focus{border-color:var(--focus);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 22%,transparent)}
input[aria-invalid="true"],select[aria-invalid="true"]{border-color:var(--bad)}
.toolbar select,.toolbar input{width:auto}
.toolbar .search input{width:100%}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;font-stretch:87.5%;color:var(--ink-2);min-width:0}
label.f input,label.f select,label.f textarea{font-weight:400;font-stretch:100%;color:var(--ink)}
label.f .hint{font-weight:400;font-stretch:100%;color:var(--ink-3);font-size:12px}
.check{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2);cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--ink)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.span2{grid-column:span 2}
.unitbox{position:relative}
.unitbox input{padding-right:46px}
.unitbox span{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--ink-3);pointer-events:none;font-weight:500}
.seg{display:inline-flex;flex-wrap:wrap;gap:6px}
.seg button{height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--rule);background:var(--surface);font-size:13px;font-weight:600;cursor:pointer;color:var(--ink-2);white-space:nowrap}
.seg button .n{font-variant-numeric:tabular-nums;color:var(--ink-3);margin-left:4px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.seg button[aria-pressed="true"] .n{color:inherit;opacity:.7}

/* ---------- tables ---------- */
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--rule);border-radius:8px;-webkit-overflow-scrolling:touch}
table.tbl{border-collapse:separate;border-spacing:0;width:100%}
.tbl th{font-stretch:75%;font-weight:650;font-size:13px;color:var(--ink-2);text-align:left;padding:9px 12px;border-bottom:1px solid var(--rule);background:var(--surface-2);white-space:nowrap;vertical-align:bottom}
.tbl th.num{text-align:right}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--rule-2);vertical-align:middle}
.tbl tbody tr{background:var(--surface)}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tfoot td{border-top:1px solid var(--rule);background:var(--surface-2);font-weight:700;padding:10px 12px}
.tbl .sticky{position:sticky;left:0;z-index:1;background:inherit}
.tbl td.sticky{min-width:140px}
.tbl th.sticky{background:var(--surface-2);z-index:2}
.tbl tfoot td.sticky{background:var(--surface-2)}
.tbl tr[data-open]{cursor:pointer}
.tbl tr[data-open]:hover{background:var(--surface-2)}
.tbl tr.void td{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--ink-3)}
.tbl tr.void td.keep{text-decoration:none}
.tbl tr.day td{background:var(--bg);font-size:13px;font-weight:700;font-stretch:87.5%;color:var(--ink-2);padding:6px 12px;border-bottom:1px solid var(--rule-2)}
.tbl .name{font-weight:600}
.tbl .w-min{width:1%}
.tbl input{height:34px}
.tbl td.pos{color:var(--ok)}
.tbl td.neg{color:var(--bad)}
.more{display:flex;justify-content:center;padding:12px}

/* ---------- chips ---------- */
.cat{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-stretch:87.5%;color:var(--ink-2);white-space:nowrap}
.cat::before{content:"";width:10px;height:10px;border-radius:2px;background:var(--c,#9AA5AB);box-shadow:inset 0 0 0 1px rgba(0,0,0,.16);flex:none}
.st{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:650;font-stretch:87.5%;white-space:nowrap}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.st.ok{color:var(--ok)}.st.warn{color:var(--warn)}.st.bad{color:var(--bad)}.st.mute{color:var(--ink-3)}
.tape{display:inline-block;background:var(--tape);color:var(--tape-ink);font-size:11px;font-weight:700;font-stretch:87.5%;padding:1px 6px;border-radius:2px;vertical-align:middle;white-space:nowrap}
.chg-up{color:var(--bad)}.chg-down{color:var(--ok)}

/* ---------- panels ---------- */
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:18px}
.panel+.panel{margin-top:16px}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.section{margin-top:28px}
.section>.panel-head{margin-bottom:10px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.cols>.panel+.panel{margin-top:0}
dl.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px;margin:0}
.sheet-body>dl.facts{margin-top:18px}
.nowrap,.tbl td.tnum{white-space:nowrap}
.srp-missing{font-size:24px;font-weight:750;font-stretch:112.5%;line-height:1.2;letter-spacing:-.01em;max-width:28ch}
.spark-cap{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
@media (min-width:641px){.lines .line+.line .lbl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}.lines .line+.line{padding-top:8px;padding-bottom:8px}}
dl.facts div{min-width:0}
dl.facts dt{font-size:12.5px;font-weight:600;font-stretch:87.5%;color:var(--ink-2)}
dl.facts dd{margin:2px 0 0;font-size:15px;font-variant-numeric:tabular-nums}
dl.facts dd small{color:var(--ink-3);font-size:12.5px}
.empty{padding:36px 20px;text-align:center;color:var(--ink-2)}
.empty h3{color:var(--ink);margin-bottom:6px}
.empty .btn{margin-top:14px}
.note{font-size:13px;color:var(--ink-2);background:var(--surface-2);border-radius:6px;padding:10px 12px}
.note.warn{background:var(--warn-bg);color:var(--warn)}
.note.bad{background:var(--bad-bg);color:var(--bad)}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 14px;border-radius:8px;background:var(--tape);color:var(--tape-ink);font-size:14px;margin-bottom:16px}

/* ---------- price build-up ---------- */
.build{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.build-top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.srp-label{font-size:14px;color:var(--ink-2);margin-bottom:6px}
.srp-big{font-size:clamp(44px,8vw,68px);font-weight:800;font-stretch:125%;line-height:.95;letter-spacing:-.015em;font-variant-numeric:tabular-nums}
.srp-meta{font-size:13px;color:var(--ink-3);margin-top:8px;font-variant-numeric:tabular-nums}
.bar{display:flex;height:34px;border-radius:5px;overflow:hidden;gap:2px;background:var(--surface-2)}
.bar i{display:block;height:100%;min-width:2px}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:8px 20px;margin:0;padding:0;list-style:none}
.legend li{display:grid;grid-template-columns:12px 1fr auto;gap:8px;align-items:baseline;font-size:13.5px;padding:4px 0;border-bottom:1px solid var(--rule-2)}
.legend li b{width:12px;height:12px;border-radius:2px;display:block;align-self:center;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.legend .v{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.legend .p{color:var(--ink-3);font-weight:400;margin-left:6px;font-size:12px}

/* ---------- sheets / drawers ---------- */
.layer{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:var(--scrim);padding:24px;padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));animation:fade .14s ease-out}
.layer.drawer{justify-content:flex-end;padding:0}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--surface);border-radius:10px;width:100%;max-width:760px;max-height:100%;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.sheet.wide{max-width:1040px}
.sheet.narrow{max-width:460px}
.sheet.mid{max-width:580px}
.drawer .sheet{max-width:600px;height:100%;border-radius:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);animation:slide .18s ease-out}
@keyframes slide{from{transform:translateX(24px);opacity:.4}}
.sheet-head{display:flex;align-items:center;gap:12px;padding:14px 16px 14px 20px;border-bottom:1px solid var(--rule)}
.sheet-head h2{flex:1;font-size:19px;font-stretch:106%}
.sheet-body{padding:18px 20px;overflow:auto;flex:1}
.sheet-foot{display:flex;align-items:center;gap:10px;justify-content:flex-end;padding:12px 20px;border-top:1px solid var(--rule);background:var(--surface-2);flex-wrap:wrap}
.sheet-foot .grow{flex:1;min-width:140px;font-size:14px;color:var(--ink-2)}
.sheet-foot .grow b{color:var(--ink);font-variant-numeric:tabular-nums}
.sheet-body>*+*{margin-top:16px}
details.more-fields summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--ink-2)}
details.more-fields[open] summary{margin-bottom:12px}

/* line editors */
.lines{display:flex;flex-direction:column;gap:8px}
.line{display:grid;gap:8px;align-items:end;padding:10px;border:1px solid var(--rule-2);border-radius:8px;background:var(--surface-2)}
.line.rcv{grid-template-columns:minmax(0,2.4fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) 34px}
.line.iss{grid-template-columns:minmax(0,2.6fr) minmax(0,1.2fr) minmax(0,1.4fr) 34px}
.line.ing{grid-template-columns:minmax(0,2.6fr) minmax(0,1fr) minmax(0,.9fr) minmax(0,1.3fr) 34px}
.line .hint{font-size:12px;color:var(--ink-3);font-weight:400;padding-bottom:10px;font-variant-numeric:tabular-nums}
.line .hint.bad{color:var(--bad)}
.line .icon-btn{margin-bottom:3px}
.fill{display:flex;gap:8px;align-items:end;flex-wrap:wrap;padding:12px;border:1px dashed var(--rule);border-radius:8px}
.fill label{flex:1 1 180px}
.fill label.qty{flex:0 1 110px}

/* chips editor */
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;height:30px;padding:0 4px 0 10px;border:1px solid var(--rule);border-radius:15px;font-size:13px;background:var(--surface)}
.chip button{border:0;background:none;width:22px;height:22px;border-radius:50%;cursor:pointer;color:var(--ink-3);display:grid;place-items:center}
.chip button:hover{background:var(--surface-2);color:var(--bad)}
.chip-add{display:inline-flex;gap:6px}
.chip-add input{height:30px;width:150px;font-size:13px}

/* toasts */
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(92vw,520px)}
.toast{background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);pointer-events:auto;animation:fade .15s}
.toast.bad{background:var(--bad);color:#fff}

/* popover */
.pop{position:absolute;right:0;top:40px;width:300px;background:var(--surface);border:1px solid var(--rule);border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.18);padding:16px;z-index:40;font-size:14px}
.pop p+p{margin-top:8px}
.pop .btn{margin-top:12px;width:100%}
.rel{position:relative}

.spark{display:block;width:100%;height:64px}
.spark polyline{fill:none;stroke:var(--ink);stroke-width:2;vector-effect:non-scaling-stroke}
.spark circle{fill:var(--ink)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--rule-2);font-size:14px}
.kv:last-child{border-bottom:0}
.kv>span:last-child{font-variant-numeric:tabular-nums;font-weight:600;text-align:right;white-space:nowrap}
body.readonly [data-write]{display:none!important}
/* forms hub */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{display:grid;grid-template-columns:40px minmax(0,1fr);gap:2px 12px;align-items:center;text-align:left;padding:14px 16px;border:1px solid var(--rule);border-radius:8px;background:var(--surface);cursor:pointer;color:var(--ink);font:inherit}

<script>
'use strict';
/* =========================================================
   Utilities
   ========================================================= */
const $ = (s, r = document) => r.querySelector(s);

const pad = n => String(n).padStart(2, '0');

/* =========================================================

const Local = (() => {

/* Unit conversion: same unit, or within mass / volume families */
const MASS = { mg: 0.001, g: 1, kg: 1000, oz: 28.349523125, lb: 453.59237 };

  const f = nu(from), t = nu(to);
  if (q == null || !f || !t) return null;
  if (f === t) return q;
  if (MASS[f] && MASS[t]) return q * MASS[f] / MASS[t];
  if (VOL[f] && VOL[t]) return q * VOL[f] / VOL[t];
  return null;
}

function settingsFrom(raw) {
  const s = { ...clone(DEFAULTS), ...(raw || {}) };
  for (const k of ['staff', 'units', 'materialCategories', 'recipeCategories', 'purposes', 'wasteReasons', 'channels']) if (!Array.isArray(s[k])) s[k] = clone(DEFAULTS[k]);
  if (!s.channels.length) s.channels = clone(DEFAULTS.channels);
  for (const k of ['labor', 'overhead', 'profit', 'vat', 'buffer', 'rounding', 'targetFoodCost', 'maxYieldVar', 'maxPortionVar']) {
    const n = num(s[k]); s[k] = n == null ? DEFAULTS[k] : n;
  }

}

function computeMaterials(materials, entries) {
  const mats = Object.entries(materials).map(([id, d]) => ({ ...d, id }));
  const agg = {};
  for (const m of mats) agg[m.id] = { purchases: [], moves: [], qIn: 0, qOut: 0, pq: 0, pv: 0 };
  for (const e of entries) {
    if (e.void) continue;
    const a = agg[e.materialId]; if (!a) continue;
    const q = num(e.qty) || 0;
    a.moves.push(e);
    if (e.type === 'purchase') { a.purchases.push(e); a.pq += q; a.pv += q * (num(e.unitCost) || 0); a.qIn += q; }
    else if (isOut(e)) a.qOut += q;
    else if (e.type === 'adjust') { if (q >= 0) a.qIn += q; else a.qOut += -q; }
  }
  for (const m of mats) {
    const a = agg[m.id];
    m.purchases = a.purchases; m.moves = a.moves;
    m.totalPurchased = a.pq;
    m.wac = a.pq > 0 ? a.pv / a.pq : null;
    const last = a.purchases[a.purchases.length - 1];
    m.latestCost = last ? num(last.unitCost) : null;
    m.latestDate = last ? last.date : null;
    let prev = null;
    if (last) for (let i = a.purchases.length - 1; i >= 0; i--) if (a.purchases[i].date < last.date) { prev = a.purchases[i]; break; }
    m.prevCost = prev ? num(prev.unitCost) : null;
    m.change = m.latestCost != null && m.prevCost ? (m.latestCost - m.prevCost) / m.prevCost : null;
    const quote = num(m.quote);
    if (quote > 0) { m.pricingCost = quote; m.priceSource = 'Quote'; }
    else if (m.latestCost > 0) { m.pricingCost = m.latestCost; m.priceSource = 'Latest purchase'; }
    else if (m.wac > 0) { m.pricingCost = m.wac; m.priceSource = 'Weighted average'; }
    else { m.pricingCost = null; m.priceSource = 'No price'; }
    m.qIn = a.qIn; m.qOut = a.qOut;
    m.onHand = a.qIn - a.qOut;
    m.bookCost = m.wac ?? m.pricingCost ?? 0;
    m.value = m.onHand * m.bookCost;
    const min = num(m.minStock) || 0;
    m.status = m.onHand < -1e-9 ? 'negative' : min <= 0 ? 'setmin' : m.onHand <= min ? 'reorder' : 'ok';
  }

}

function computeRecipe(r, matById, S) {
  const std = num(r.standardYield) || 0, fb = num(r.finishedBatch) || 0, tp = num(r.targetPortion) || 0, act = num(r.actualServings) || 0;

  const actualPortion = fb > 0 && yieldUsed > 0 ? fb / yieldUsed : null;
  const yieldVar = std > 0 && yieldUsed > 0 ? (yieldUsed - std) / std : null;
  const portionVar = tp > 0 && actualPortion > 0 ? (actualPortion - tp) / tp : null;
  let yieldStatus;

  const lines = (r.ingredients || []).map(l => {
    const m = matById[l.materialId];
    const q = num(l.qty);
    const qtyInv = m ? convertQty(q, l.unit || m.unit, m.unit) : null;
    const cost = m ? m.pricingCost : null;
    const costBatch = qtyInv != null ? qtyInv * (cost || 0) : null;
    const status = !m ? 'missing' : qtyInv == null ? 'unit' : !(cost > 0) ? 'price' : 'ok';
    return {
      ...l, m, name: m ? m.name : '(missing material)', qtyNum: q, qtyInv, invUnit: m ? m.unit : '', cost, costBatch,
      perServing: q != null && yieldUsed > 0 ? q / yieldUsed : null,
      costServing: costBatch != null && yieldUsed > 0 ? costBatch / yieldUsed : null,
      source: m ? m.priceSource : '', status

  });
  const batchCost = lines.reduce((s, l) => s + (l.costBatch || 0), 0);
  const okCount = lines.filter(l => l.status === 'ok').length;
  const completeness = lines.length ? okCount / lines.length : 0;
  const ready = lines.length > 0 && okCount === lines.length;
  return {
    theo, yieldUsed, actualPortion, yieldVar, portionVar, yieldStatus, lines, batchCost,
    costPerServing: yieldUsed > 0 ? batchCost / yieldUsed : null,
    completeness, ready, costing: ready ? 'ready' : 'incomplete', missing: lines.filter(l => l.status !== 'ok')

function channelRates(ch, S) {
  const o = (v, d) => { const n = num(v); return n == null ? d : n; };
  return {
    labor: o(ch.labor, S.labor), overhead: o(ch.overhead, S.overhead), profit: o(ch.profit, S.profit), vat: o(ch.vat, S.vat),
    delivery: num(ch.delivery) || 0, commission: num(ch.commission) || 0,
    fixedDel: (num(ch.fixedDelivery) || 0) / Math.max(1, num(ch.servingsPerOrder) || 1),
    chOther: num(ch.otherFixed) || 0

}

/* Serving sizes: the standard serving plus optional extra sizes.

function sizeList(r, rc) {

  if (1 - pctSum <= 0) return { ...base, ok: false, reason: 'pct' };

  const net = fixed / (1 - pctSum);

      { k: 'buf', label: 'Price buffer', v: bufferAmt },
      { k: 'pack', label: 'Packaging & fixed', v: pack + other + R.chOther },
      { k: 'labor', label: 'Labor', v: net * R.labor },
      { k: 'over', label: 'Overhead', v: net * R.overhead },
      { k: 'deliv', label: 'Delivery', v: net * R.delivery + R.fixedDel },
      { k: 'comm', label: 'Commission', v: net * R.commission },
      { k: 'profit', label: 'Target profit', v: net * R.profit },
      { k: 'vat', label: 'VAT', v: vatAmt },

/* What a given menu price actually earns (uses actual, unbuffered ingredient cost) */
function menuCheck(price, rc, r, ch, S, sz) {
  const p = num(price); if (!(p > 0)) return null;

  R.fixedDel = sizeFixedDel(ch, f);
  const net = p / (1 + R.vat);
  const ingr = (rc.costPerServing || 0) * f;
  const pack = sz ? sz.packaging : num(r.packaging) || 0, other = sz ? sz.otherFixed : num(r.otherFixed) || 0;
  const costs = ingr + pack + other + R.fixedDel + R.chOther + net * (R.labor + R.overhead + R.delivery + R.commission);

function costControl(r, rc, prices, S) {

  const basis = menu > 0 ? 'menu' : 'suggested';

  const t = num(r.targetFoodCost);
  const targetFC = t > 0 ? t : S.targetFoodCost;

function compute(view) {
  const S = settingsFrom(view.settings.main);
  CUR = S.currency || '₱';
  const entries = [], events = [];
  for (const [day, doc] of Object.entries(view.txns)) {
    const ents = (doc && doc.entries) || {};
    for (const [id, e] of Object.entries(ents)) {
      if (!e) continue;
      const x = { ...e, id, day, date: e.date || day };
      if (e.materialId) entries.push(x);
      else if (e.recipeId && (e.type === 'production' || e.type === 'dishwaste' || e.type === 'fgadjust')) events.push(x);
    }
  }
  const byTime = (a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : String(a.at || '').localeCompare(String(b.at || '')));
  entries.sort(byTime); events.sort(byTime);

  // sales: raw materials used by made-to-order dishes and resale items come out of stock at sale
  const sales = [];
  for (const [docId, doc] of Object.entries(view.sales || {})) {
    for (const [id, e] of Object.entries((doc && doc.entries) || {})) if (e && e.type === 'sale') sales.push({ ...e, id, doc: docId, date: e.date || (doc && doc.day) });
  }
  sales.sort(byTime);
  const soldUse = [];
  for (const sa of sales) {
    if (sa.void) continue;
    (sa.items || []).forEach((it, i) => (it.use || []).forEach((u, j) => soldUse.push({ id: `${sa.id}:${i}:${j}`, type: 'sold', materialId: u.m, qty: u.q, unitCost: u.c, unit: '', date: sa.date, at: sa.at, purpose: `Sale ${sa.receipt || ''}`.trim(), saleId: sa.id })));
  }
  const allMats = computeMaterials(view.materials, soldUse.length ? [...entries, ...soldUse].sort(byTime) : entries);
  const matById = {}; for (const m of allMats) matById[m.id] = m;
  const mats = allMats.filter(m => !m.archived).sort(byName);
  const recipes = Object.entries(view.recipes).map(([id, d]) => {
    const r = { ...d, id };
    const rc = computeRecipe(r, matById, S);
    const sz = sizeList(r, rc);
    for (const z of sz) {
      z.prices = S.channels.map(ch => priceFor(rc, r, ch, S, z));
      z.ingr = (rc.costPerServing || 0) * (z.factor || 0);
    }
    const prices = sz[0].prices;
    const cc = costControl(r, rc, prices, S);
    const batches = events.filter(e => !e.void && e.type === 'production' && e.recipeId === id);
    return { ...r, rc, sz, prices, cc, batches };
  }).sort(byName);
  const recById = {}; for (const r of recipes) recById[r.id] = r;
  // finished goods: cooked servings in, sales / dish waste out, leftover counts adjust
  const fgById = {}; const td = today();
  for (const r of recipes) fgById[r.id] = { r, in: 0, out: 0, sold: 0, waste: 0, adj: 0, costSum: 0, costServ: 0, last: null, lastDate: null, today: { made: 0, sold: 0, waste: 0 } };
  for (const e of events) {
    if (e.void) continue; const f = fgById[e.recipeId]; if (!f) continue;
    if (e.type === 'production') {
      const sv = num(e.servings) > 0 ? num(e.servings) : (f.r.rc.yieldUsed || 0) * (num(e.batches) || 0);
      f.in += sv;
      if (num(e.ingredientCost) > 0 && sv > 0) { f.costSum += num(e.ingredientCost); f.costServ += sv; }
      const t = e.at || e.date; if (!f.last || t > f.last) { f.last = t; f.lastDate = e.date; }
      if (e.date === td) f.today.made += sv;
    } else if (e.type === 'dishwaste') { const q = num(e.qty) || 0; f.waste += q; f.out += q; if (e.date === td) f.today.waste += q; }
    else if (e.type === 'fgadjust') f.adj += num(e.qty) || 0;

    if (sa.void) continue;
    for (const it of sa.items || []) {
      if (!it.fg) continue; const f = fgById[it.recipeId]; if (!f) continue;
      const sv = (num(it.qty) || 0) * (num(it.factor) || 1); f.sold += sv; f.out += sv; if (sa.date === td) f.today.sold += sv;
    }

    f.avgCost = f.costServ > 0 ? f.costSum / f.costServ : (f.r.rc.costPerServing || 0);

  }

    if (e.void || e.type !== 'purchase' || !e.supplier) continue;
    const k = e.supplier.trim().toLowerCase();

    return { ...d, id, lines, total, anyRecv, state, open: ['draft', 'sent', 'partial'].includes(state) };

/* Monthly report, mirrors the "Monthly Inventory Report" sheet */
function monthlyReport(model, month) {
  const start = month + '-01';
  const [y, m] = month.split('-').map(Number);
  const end = `${y}-${pad(m)}-${pad(new Date(y, m, 0).getDate())}`;
  const rows = model.mats.map(mat => {
    let open = 0, rec = 0, used = 0, waste = 0, adj = 0, pv = 0, uc = 0, wc = 0;
    for (const e of mat.moves) {
      const q = num(e.qty) || 0;
      if (e.date < start) { open += signedQty(e); continue; }
      if (e.date > end) continue;
      if (e.type === 'purchase') { rec += q; pv += q * (num(e.unitCost) || 0); }
      else if (e.type === 'issue' || e.type === 'sold') { used += q; uc += q * (num(e.unitCost) || 0); }
      else if (e.type === 'waste') { waste += q; wc += q * (num(e.unitCost) || 0); }
      else adj += q;
    }
    const close = open + rec - used - waste + adj;
    return { mat, open, rec, used, waste, adj, close, wac: mat.wac, pv, uc, wc, closeValue: close * (mat.bookCost || 0) };
  });
  const inMonth = e => !e.void && e.date >= start && e.date <= end;
  const wasteByReason = {};
  for (const e of model.log) {
    if (!inMonth(e) || (e.type !== 'waste' && e.type !== 'dishwaste')) continue;
    const k = e.reason || 'Unspecified';
    const w = wasteByReason[k] || (wasteByReason[k] = { raw: 0, dish: 0 });
    w[e.type === 'waste' ? 'raw' : 'dish'] += (num(e.qty) || 0) * (num(e.unitCost) || 0);
  }
  const production = {};
  for (const e of model.events) {
    if (!inMonth(e) || e.type !== 'production') continue;
    const p = production[e.recipeId] || (production[e.recipeId] = { batches: 0, servings: 0, servBatches: 0, cost: 0 });
    const b = num(e.batches) || 0;
    p.batches += b; p.cost += num(e.ingredientCost) || 0;
    if (num(e.servings) > 0) { p.servings += num(e.servings); p.servBatches += b; }
  }
  return { start, end, rows, wasteByReason, production };
}

/* Yield check for one production record, same tolerance rules as recipe costing */
function batchYield(r, batches, finishedQty, servings, S) {
  const std = num(r.standardYield) || 0, tp = num(r.targetPortion) || 0;
  const b = num(batches) || 0;
  const spb = num(servings) > 0 && b > 0 ? num(servings) / b : null;
  const fpb = num(finishedQty) > 0 && b > 0 ? num(finishedQty) / b : null;
  const theo = fpb && tp > 0 ? fpb / tp : null;
  const yieldPer = spb ?? theo;
  const portion = fpb && yieldPer ? fpb / yieldPer : null;
  const yv = std > 0 && yieldPer ? (yieldPer - std) / std : null;
  const pv = tp > 0 && portion ? (portion - tp) / tp : null;
  let status = null;
  if (yieldPer) status = Math.abs(yv ?? 0) <= S.maxYieldVar + 1e-12 ? (Math.abs(pv ?? 0) <= S.maxPortionVar + 1e-12 ? 'on-target' : 'portion-check') : (yv < 0 ? 'low' : 'high');
  return { spb, fpb, yieldPer, portion, yv, pv, status };
}

/* Display helpers for sizes */
function portionText(z, r) {
  if (z.portion) return `${qty(z.portion, 1)} ${r.measureUnit || ''}`.trim();
  if (z.factor) return `${qty(z.factor, 2)} serving${z.factor === 1 ? '' : 's'}`;
  return '—';
}
function perUnitLabel(r) { const u = nu(r.measureUnit); return u === 'g' ? 'per 100 g' : u === 'ml' ? 'per 100 ml' : r.measureUnit ? 'per ' + r.measureUnit : null; }
function perUnitPrice(price, z, r) { if (!(price > 0) || !z.portion) return null; const u = nu(r.measureUnit); return (u === 'g' || u === 'ml') ? price / z.portion * 100 : price / z.portion; }

/* Sales summary for a date range */
function salesSummary(model, start, end) {
  const list = model.sales.filter(s => !s.void && s.date >= start && s.date <= end);
  const sum = { orders: list.length, gross: 0, disc: 0, net: 0, vat: 0, cost: 0, byPay: {}, byChannel: {}, byDay: {}, items: {} };
  for (const s of list) {
    const cost = (s.items || []).reduce((a, it) => a + (num(it.qty) || 0) * (num(it.unitCost) || 0), 0);
    const g = num(s.subtotal) || 0, d = num(s.discount && s.discount.amount) || 0, n = num(s.total) || 0, v = num(s.vat) || 0;
    sum.gross += g; sum.disc += d; sum.net += n; sum.vat += v; sum.cost += cost;
    sum.byPay[s.payment || 'Other'] = (sum.byPay[s.payment || 'Other'] || 0) + n;
    const cn = s.channelName || s.channel || 'Other'; sum.byChannel[cn] = (sum.byChannel[cn] || 0) + n;
    const dd = sum.byDay[s.date] || (sum.byDay[s.date] = { orders: 0, gross: 0, disc: 0, net: 0, vat: 0, cost: 0 });
    dd.orders++; dd.gross += g; dd.disc += d; dd.net += n; dd.vat += v; dd.cost += cost;
    for (const it of s.items || []) {
      const k = it.name + (it.size ? ' ' + it.size : '');
      const x = sum.items[k] || (sum.items[k] = { qty: 0, sales: 0 });
      x.qty += num(it.qty) || 0; x.sales += (num(it.qty) || 0) * (num(it.price) || 0);
    }
  }
  sum.exVat = sum.net - sum.vat; sum.gp = sum.exVat - sum.cost; sum.margin = sum.exVat > 0 ? sum.gp / sum.exVat : null;
  return sum;
}
function agoText(iso) {
  if (!iso) return '';
  const t = new Date(iso.length <= 10 ? iso + 'T12:00:00' : iso).getTime(); if (!Number.isFinite(t)) return '';
  const h = (Date.now() - t) / 3600000;
  if (h < 1) return `${Math.max(1, Math.round(h * 60))} min ago`;
  if (h < 24) return `${Math.round(h)} h ago`;
  const d = Math.round(h / 24); return d === 1 ? 'yesterday' : `${d} days ago`;
}

/* =========================================================
   Store: server snapshot + local outbox = what the page shows
   ========================================================= */
const server = { materials: {}, recipes: {}, suppliers: {}, settings: {}, txns: {}, pos: {}, sales: {}, customers: {} };
let outbox = [];
let view = null;
let model = null;
let pendingKeys = new Set();
const TAB = uid('tab');
const ME = { id: null, name: '', avatar: '' };
let USER = null, DL = null;
const Sync = {
  db: null, connecting: false, flushing: false, offline: typeof navigator !== 'undefined' && navigator.onLine === false,
  lastSyncedAt: null, retryTimer: null, backoff: 0, error: null, readOnly: false, subs: [], gotServer: false, failed: []
};

function buildView() {
  const v = {
    materials: { ...server.materials }, recipes: { ...server.recipes }, suppliers: { ...server.suppliers },
    settings: { ...server.settings }, txns: { ...server.txns }, pos: { ...server.pos }, sales: { ...server.sales }, customers: { ...server.customers }
  };
  const pk = new Set();
  for (const op of outbox) {
    if (op.op === 'save') {
      const base = v[op.col][op.id];
      v[op.col][op.id] = !op.isNew && base ? deepMerge(clone(base), op.diff || {}) : clone(op.full);
      pk.add(op.col + '/' + op.id);
    } else if (op.op === 'del') {
      delete v[op.col][op.id];
    } else if (op.op === 'txn') {
      const col = op.col || 'txns';
      const d = v[col][op.day];
      const nd = { day: op.dayKey || op.day, entries: { ...((d && d.entries) || {}) } };
      nd.entries[op.entry.id] = { ...op.entry };
      v[col][op.day] = nd; pk.add('e/' + op.entry.id);
    } else if (op.op === 'txnPatch') {
      const col = op.col || 'txns';
      const d = v[col][op.day];
      if (!d || !d.entries || !d.entries[op.id]) continue;
      const nd = { day: d.day || op.day, entries: { ...d.entries } };
      nd.entries[op.id] = deepMerge(clone(d.entries[op.id]), op.data);
      v[col][op.day] = nd; pk.add('e/' + op.id);

}
function rebuildNow() { view = buildView(); model = compute(view); }
let rebuildTimer = null;
function rebuild() {
  if (rebuildTimer) return;
  rebuildTimer = setTimeout(() => { rebuildTimer = null; rebuildNow(); App.refresh(); }, 30);
}

let serverSaveTimer = null;
function onServer() {
  if (Sync.offline && navigator.onLine !== false) { Sync.offline = false; }
  clearTimeout(serverSaveTimer);
  serverSaveTimer = setTimeout(() => Local.set('server', clone(server)), 800);
  rebuild();
  if (outbox.length && !Sync.flushing) flushSoon();
}

function persistOutbox() { return Local.set('outbox:' + TAB, clone(outbox)); }

async function enqueue(ops) {
  if (!Array.isArray(ops)) ops = [ops];
  if (!ops.length) return;
  for (const op of ops) { op.qid = uid('q'); op.queuedAt = Date.now(); outbox.push(op); }
  rebuildNow();
  App.refresh();
  await persistOutbox();
  flushSoon();
}

function sanitize(o) { return JSON.parse(JSON.stringify(o, (k, v) => (k && k[0] === '_' ? undefined : v))); }

function saveDoc(col, id, full, base) {
  full = sanitize(full);
  full.updatedAt = new Date().toISOString();
  full.updatedBy = ME.id || null;
  if (!base) return enqueue({ op: 'save', col, id, full, isNew: true });
  const diff = diffObj(sanitize(base), full);
  delete diff.updatedAt; delete diff.updatedBy;
  if (!Object.keys(diff).length) return Promise.resolve(false);
  diff.updatedAt = full.updatedAt; diff.updatedBy = full.updatedBy;

}
function deleteDoc(col, id) { return enqueue({ op: 'del', col, id }); }

}

/* ---------- flushing the outbox to the shared store ---------- */
function withTimeout(p, ms) {
  let t;

}
let flushTimer = null;
function flushSoon() { clearTimeout(flushTimer); flushTimer = setTimeout(flush, 60); }

async function execOp(op) {
  const db = Sync.db;
  if (op.op === 'save') {
    const ref = db.doc(op.col + '/' + op.id);
    if (op.isNew) return withTimeout(ref.set(op.full), 20000);
    try { await withTimeout(ref.update(op.diff || {}), 20000); }
    catch (e) { if (e && e.code === 'invalid_argument') await withTimeout(ref.set(op.full), 20000); else throw e; }
    return;
  }
  if (op.op === 'del') return withTimeout(db.doc(op.col + '/' + op.id).delete(), 20000);
  if (op.op === 'txnPatch') return withTimeout(db.doc((op.col || 'txns') + '/' + op.day).update({ entries: { [op.id]: op.data } }), 20000);
  if (op.op === 'txn') {
    const ref = db.doc((op.col || 'txns') + '/' + op.day);
    const body = { entries: { [op.entry.id]: op.entry } };
    try { await withTimeout(ref.update(body), 20000); return; }
    catch (e) { if (!e || e.code !== 'invalid_argument') throw e; }
    // The day's record doesn't exist yet: take a short lease so two devices don't both create it.
    for (let i = 0; i < 6; i++) {
      const lease = await withTimeout(ref.acquire({ holder: TAB, ttlMs: 5000 }), 20000);
      if (lease && lease.acquired) {
        const snap = await withTimeout(ref.get(), 20000);
        const ents = snap.exists ? (snap.data().entries || null) : null;
        if (ents) await withTimeout(ref.update(body), 20000);
        else await withTimeout(ref.set({ day: op.dayKey || op.day, entries: body.entries }), 20000);
        return;
      }
      await sleep(400 + Math.random() * 900);
      try { await withTimeout(ref.update(body), 20000); return; }
      catch (e2) { if (!e2 || e2.code !== 'invalid_argument') throw e2; }

function scheduleRetry() {
  clearTimeout(Sync.retryTimer);
  const d = [3000, 8000, 20000, 45000, 90000][Math.min(Sync.backoff, 4)];
  Sync.backoff++;
  Sync.retryTimer = setTimeout(flush, d);
}

async function flush() {
  if (Sync.flushing || !Sync.db || !outbox.length) { App.renderSync(); return; }
  if (navigator.onLine === false) { Sync.offline = true; App.renderSync(); return; }
  Sync.flushing = true; App.renderSync();
  let dropped = 0;
  try {
    while (outbox.length && Sync.db) {
      const op = outbox[0];
      try {
        await execOp(op);
      } catch (e) {
        const code = (e && e.code) || 'unavailable';
        if (code === 'invalid_argument' || code === 'transform_error') {
          outbox.shift(); dropped++; Sync.failed.push({ op, message: e.message || code });
          await persistOutbox();

        }
        if (code === 'quota_exceeded') { Sync.error = 'quota'; App.toast('The shared database is full. Archive or delete old records, then try again.', 'bad'); break; }
        if (['revoked', 'not_granted', 'capability_disabled', 'capability_removed'].includes(code)) { Sync.db = null; break; }

      }
      outbox.shift();
      Sync.offline = false; Sync.backoff = 0; Sync.error = null; Sync.lastSyncedAt = Date.now();
      await persistOutbox();
    }

    Sync.flushing = false;

      rebuildNow(); App.refresh();

    }

  }
}

/* ---------- subscriptions ---------- */
function unsubscribeAll() { for (const u of Sync.subs) { try { u(); } catch (e) { } } Sync.subs = []; }
let resubTimer = null;
function onSubError(err) {
  const code = (err && err.code) || 'unavailable';
  if (['revoked', 'not_granted', 'capability_disabled', 'capability_removed'].includes(code)) {

  }

function subscribe() {

    const o = {};
    for (const d of snap.docs) if (d.exists) o[d.id] = d.data();
    server[col] = o; Sync.gotServer = true; onServer();
  }, onSubError);
  try {
    Sync.subs.push(colSub('materials', db.collection('materials').limit(1000)));
    Sync.subs.push(colSub('recipes', db.collection('recipes').limit(1000)));
    Sync.subs.push(colSub('suppliers', db.collection('suppliers').limit(1000)));
    Sync.subs.push(colSub('pos', db.collection('pos').limit(1000)));
    Sync.subs.push(colSub('sales', db.collection('sales').orderBy('day', 'desc').limit(1000)));
    Sync.subs.push(colSub('customers', db.collection('customers').limit(1000)));

}

async function loadLocal() {
  try {
    const cached = await Local.get('server');
    if (cached && typeof cached === 'object') for (const k of Object.keys(server)) if (cached[k]) server[k] = cached[k];
    const keys = await Local.keys();
    for (const k of keys) {
      if (!String(k).startsWith('outbox:')) continue;
      const ops = await Local.get(k);
      if (Array.isArray(ops)) for (const op of ops) if (op && !outbox.some(o => o.qid === op.qid)) outbox.push(op);
      if (k !== 'outbox:' + TAB) await Local.del(k);
    }
    outbox.sort((a, b) => (a.queuedAt || 0) - (b.queuedAt || 0));
    await persistOutbox();
    const me = await Local.get('me');
    if (me && me.id) { ME.id = me.id; ME.name = me.name || ''; }
  } catch (e) { /* first run or storage blocked */ }

async function connect() {
  if (!(window.claude && typeof window.claude.use === 'function')) { App.renderSync(); return; }
  Sync.connecting = true; App.renderSync();
  const [db, user, dl] = await Promise.all([
    window.claude.use('db').catch(() => null),
    window.claude.use('user').catch(() => null),
    window.claude.use('downloads').catch(() => null)

if (typeof window !== 'undefined') {
  window.addEventListener('online', () => { Sync.offline = false; Sync.backoff = 0; App.renderSync(); flushSoon(); });

    <div class="sheet-head"><h2 data-title>${esc(title)}</h2><button type="button" class="icon-btn" data-close aria-label="Close">${ICON.close}</button></div>
    <div class="sheet-body" data-body>${body}</div>${foot ? `<div class="sheet-foot" data-foot>${foot}</div>` : ''}</div>`;

    const grp = { waste: ['waste', 'dishwaste'], adjust: ['adjust', 'fgadjust'] };
    const match = (e, t) => t === 'all' || (grp[t] ? grp[t].includes(e.type) : e.type === t);
    const c = t => base.filter(e => match(e, t)).length;
    const segs = [['all', 'All', base.length], ['purchase', 'Received', c('purchase')], ['issue', 'Issued', c('issue')], ['production', 'Production', c('production')], ['waste', 'Waste', c('waste')], ['adjust', 'Adjustments', c('adjust')]];

    if (!model.log.length) { live.innerHTML = `<div class="panel empty"><h3>No movements yet</h3><p>Record a delivery to start tracking stock and purchase prices.</p><button class="btn" data-act="receive" data-write>${ICON.receive}Receive delivery</button></div>`; return; }
    if (!rows.length) { live.innerHTML = `<div class="panel empty"><h3>Nothing matches these filters</h3></div>`; return; }

      if (e.date !== lastDay) { lastDay = e.date; body += `<tr class="day"><td class="sticky" colspan="9">${esc(fmtDate(e.date))}</td></tr>`; }
      const m = model.matById[e.materialId];
      const rcp = e.recipeId ? model.recById[e.recipeId] : null;
      const qv = num(e.qty) || 0;
      let signed = signedQty(e), unitTxt = esc(e.unit || (m && m.unit) || ''), ucost = num(e.unitCost), val = qv * (num(e.unitCost) || 0);
      let whoWhere = e.type === 'purchase' ? esc(e.supplier || '—') : esc(e.staff || '—');
      let detail = e.type === 'purchase' ? [e.invoice && 'Inv. ' + e.invoice, e.poNumber, e.quality && 'Quality ' + e.quality + '/5'].filter(Boolean).join(', ') : (e.type === 'waste' ? e.reason || '' : e.purpose || '');
      const title = e.materialId ? (m ? m.name : '(deleted material)') : (rcp ? rcp.name : e.recipeName || '(deleted recipe)');
      if (e.type === 'production') {
        const b = num(e.batches) || 0;

      } else if (e.type === 'dishwaste') {
        signed = -qv; unitTxt = 'servings'; detail = e.reason || '';
      }
      body += `<tr class="${e.void ? 'void' : ''}">
        <td class="sticky"><span class="name">${esc(title)}</span>${pendingTag('e/' + e.id)}</td>
        <td class="nowrap">${esc(TYPES[e.type] || e.type)}</td>
        <td class="num ${e.type === 'production' ? '' : signed > 0 ? 'pos' : signed < 0 ? 'neg' : ''}">${signed > 0 && e.type !== 'production' ? '+' : ''}${qty(signed)} <span class="faint">${unitTxt}</span></td>
        <td class="num">${M(ucost)}</td>
        <td class="num">${M(val)}</td>
        <td>${whoWhere}</td>
        <td class="small">${esc(detail)}${e.remarks ? `<div class="faint">${esc(e.remarks)}</div>` : ''}${e.void ? `<div class="keep st bad">Voided${e.voidReason ? ': ' + esc(e.voidReason) : ''}</div>` : ''}</td>

    }
    live.innerHTML = `<div class="tbl-wrap"><table class="tbl"><thead><tr><th class="sticky">Material</th><th>Type</th><th class="num">Qty</th><th class="num">Unit cost</th><th class="num">Value</th><th>Supplier / staff</th><th>Details</th><th>Logged by</th><th></th></tr></thead><tbody>${body}</tbody></table></div>

function wireRecipeInputs(root, r, z) {

function assumpButtons(form) {
  const s = $('[data-save]', form), d = $('[data-pa="discard"]', form);
  if (s) s.disabled = !pricingDirty; if (d) d.disabled = !pricingDirty;
}
function collectAssump(form) {
  const base = clone(pricingDraft || model.S);
  const errs = [];
  const parse = (inp, t, label) => {
    inp.removeAttribute('aria-invalid');
    const raw = inp.value.trim();
    if (t === 'text') return raw;
    if (raw === '') { if (t === 'opct') return null; errs.push(label + ' is required'); inp.setAttribute('aria-invalid', 'true'); return null; }
    const n = num(raw);
    if (n == null || n < 0 || ((t === 'pct' || t === 'opct') && n >= 100)) { errs.push(label + (t.includes('pct') ? ' must be between 0 and 99.99' : ' must be zero or more')); inp.setAttribute('aria-invalid', 'true'); return null; }
    if (t === 'num' && n < 1) { errs.push(label + ' must be at least 1'); inp.setAttribute('aria-invalid', 'true'); return null; }
    return t === 'pct' || t === 'opct' ? n / 100 : n;
  };
  $$('[data-g]', form).forEach(inp => { const f = GLOBAL_FIELDS.find(x => x[0] === inp.dataset.g); base[inp.dataset.g] = parse(inp, inp.dataset.t, f[1]); });
  $$('[data-ci]', form).forEach(inp => {
    const i = +inp.dataset.ci, k = inp.dataset.k; const f = CH_FIELDS.find(x => x[0] === k);
    const v = parse(inp, inp.dataset.t, f[1]);
    if (k === 'name' && !v) { errs.push('Every channel needs a name'); inp.setAttribute('aria-invalid', 'true'); }
    base.channels[i][k] = v;
  });
  return { data: base, errs };
}
async function saveAssumptions(form) {
  const { data, errs } = collectAssump(form);
  const err = $('[data-err]', form);
  if (errs.length) { err.hidden = false; err.textContent = [...new Set(errs)].join('. ') + '.'; return; }
  err.hidden = true;
  const raw = view.settings.main || null;
  const full = { ...(raw ? clone(raw) : {}) };
  for (const [k] of GLOBAL_FIELDS) full[k] = data[k];
  full.channels = data.channels;
  for (const k of ['staff', 'units', 'materialCategories', 'recipeCategories', 'purposes', 'currency']) if (full[k] == null) full[k] = clone(model.S[k]);
  await saveDoc('settings', 'main', full, raw);
  pricingDirty = false; pricingDraft = null;
  toast('Assumptions saved. Prices updated for everyone.');
  renderAssump(form);
}
function saveSettingsPatch(patch) {
  const raw = view.settings.main || null;
  const full = { ...(raw ? clone(raw) : clone(model.S)), ...patch };
  return saveDoc('settings', 'main', full, raw);
}

Views.stockreport = {
  mount(el) {
    const f = ui.reports;
    el.innerHTML = `
      ${reportNav('stockreport')}
      <div class="head"><div><h1>Inventory report</h1><p class="sub">Monthly stock movement, usage by dish, waste, production and ingredient price changes.</p></div>
        <div class="actions"><button class="btn ghost" data-act="export-xlsx">${ICON.download}Export to Excel</button></div></div>
      <div class="toolbar"><label class="f" style="flex-direction:row;align-items:center;gap:8px">Month<input type="month" data-f="month" value="${esc(f.month)}" style="width:auto"></label>
        <label class="check"><input type="checkbox" data-f="all" ${f.all ? 'checked' : ''}>Include materials with no activity</label></div>
      <div data-live></div>`;
    bindFilters(el, f, () => Views.reports.update());
  },
  update() {
    const el = $('#view'); const f = ui.reports;
    if (!/^\d{4}-\d{2}$/.test(f.month)) f.month = thisMonth();
    const rep = monthlyReport(model, f.month);
    const rows = rep.rows.filter(r => f.all || r.open || r.rec || r.used || r.waste || r.adj || r.close);
    const T = k => rows.reduce((s, r) => s + (r[k] || 0), 0);
    // usage by purpose
    const usage = {};
    for (const e of model.entries) {
      if (e.void || e.type !== 'issue' || e.date < rep.start || e.date > rep.end) continue;
      const k = e.purpose || 'Unspecified';
      const u = usage[k] || (usage[k] = { cost: 0, n: 0 });
      u.cost += (num(e.qty) || 0) * (num(e.unitCost) || 0); u.n++;
    }
    const usageRows = Object.entries(usage).sort((a, b) => b[1].cost - a[1].cost);
    const usageTotal = usageRows.reduce((s, [, u]) => s + u.cost, 0);
    const wasteRows = Object.entries(rep.wasteByReason).sort((a, b) => (b[1].raw + b[1].dish) - (a[1].raw + a[1].dish));
    const wasteTotal = wasteRows.reduce((s, [, w]) => s + w.raw + w.dish, 0);
    const prodRows = Object.entries(rep.production).sort((a, b) => b[1].batches - a[1].batches);
    const changes = model.mats.filter(m => m.change != null).sort((a, b) => Math.abs(b.change) - Math.abs(a.change));
    const usedIn = id => model.recipes.filter(r => (r.ingredients || []).some(l => l.materialId === id)).length;
    const ss = salesSummary(model, rep.start, rep.end);
    const topItems = Object.entries(ss.items).sort((a, b) => b[1].sales - a[1].sales).slice(0, 10);
    const custAgg = {};
    for (const c of model.customers) for (const x of c.sales) { if (x.void || x.date < rep.start || x.date > rep.end) continue; const a = custAgg[c.id] || (custAgg[c.id] = { orders: 0, spent: 0 }); a.orders++; a.spent += num(x.total) || 0; }
    const topCust = Object.entries(custAgg).sort((a, b) => b[1].spent - a[1].spent).slice(0, 5);
    const days = Object.entries(ss.byDay).sort((a, b) => a[0].localeCompare(b[0]));
    const salesHtml = ss.orders ? `
      <div class="cols">
        <section class="panel"><div class="panel-head"><h2>Sales for ${esc(fmtMonth(f.month))}</h2><span class="small muted">${ss.orders} order${ss.orders === 1 ? '' : 's'}</span></div>
          <div class="kv"><span>Gross sales</span><span>${money(ss.gross)}</span></div>
          <div class="kv"><span>Discounts</span><span>−${money(ss.disc)}</span></div>
          <div class="kv"><span>Net sales</span><span>${money(ss.net)}</span></div>

          <div class="kv"><span>Cost of goods sold</span><span>${money(ss.cost)}</span></div>

          <h3 style="margin:14px 0 4px">By payment</h3>${Object.entries(ss.byPay).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<div class="kv"><span>${esc(k)}</span><span>${money(v)}</span></div>`).join('')}

        </section>
        <section class="panel"><div class="panel-head"><h2>Best sellers</h2><span class="small muted">By sales value</span></div>
          ${topItems.map(([k, x]) => `<div class="kv"><span>${esc(k)} <span class="faint small">${qty(x.qty)} sold</span></span><span>${money(x.sales)}</span></div>`).join('')}
          ${topCust.length ? `<h3 style="margin:16px 0 4px">Top customers</h3>${topCust.map(([cid, x]) => `<div class="kv" data-open="customer" data-id="${esc(cid)}" style="cursor:pointer"><span>${esc(model.custById[cid].name || model.custById[cid].phone || 'Customer')} <span class="faint small">${x.orders} order${x.orders > 1 ? 's' : ''}</span></span><span>${money(x.spent)}</span></div>`).join('')}` : ''}
        </section>
      </div>
      <div class="tbl-wrap section"><table class="tbl"><thead><tr><th class="sticky">Day</th><th class="num">Orders</th><th class="num">Gross</th><th class="num">Discounts</th><th class="num">Net sales</th><th class="num">Cost of goods</th><th class="num">Gross profit</th><th class="num">Margin</th></tr></thead><tbody>
        ${days.map(([d, x]) => { const ex = x.net - x.vat, gp = ex - x.cost; return `<tr><td class="sticky tnum">${esc(fmtDate(d))}</td><td class="num">${x.orders}</td><td class="num">${money(x.gross)}</td><td class="num">${x.disc ? money(x.disc) : DASH}</td><td class="num"><b>${money(x.net)}</b></td><td class="num">${money(x.cost)}</td><td class="num">${money(gp)}</td><td class="num">${P(ex > 0 ? gp / ex : null)}</td></tr>`; }).join('')}
      </tbody></table></div>` : `<div class="panel empty" style="padding:22px"><h3>No sales in ${esc(fmtMonth(f.month))}</h3><p>Sales rung up on the Sell tab appear here with cost of goods and gross profit.</p></div>`;
    $('[data-live]', el).innerHTML = `
      <section><div class="panel-head"><h2>Inventory for ${esc(fmtMonth(f.month))}</h2><span class="small muted">${esc(fmtDate(rep.start))} to ${esc(fmtDate(rep.end))}</span></div>
      ${rows.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th class="sticky">Material</th><th>Category</th><th class="num">Opening</th><th class="num">Received</th><th class="num">Used</th><th class="num">Waste</th><th class="num">Count adj.</th><th class="num">Closing</th><th class="num">Avg cost</th><th class="num">Purchases</th><th class="num">Usage cost</th><th class="num">Waste cost</th><th class="num">Closing value</th><th>Status now</th></tr></thead><tbody>
        ${rows.map(r => `<tr data-open="mat" data-id="${esc(r.mat.id)}"><td class="sticky"><span class="name">${esc(r.mat.name)}</span> <span class="faint small">${esc(r.mat.unit)}</span></td><td>${catChip(r.mat.category)}</td>
          <td class="num">${qty(r.open)}</td><td class="num">${qty(r.rec)}</td><td class="num">${qty(r.used)}</td><td class="num">${r.waste ? qty(r.waste) : '0'}</td><td class="num">${r.adj ? (r.adj > 0 ? '+' : '') + qty(r.adj) : '0'}</td><td class="num"><b>${qty(r.close)}</b></td>
          <td class="num">${M(r.wac)}</td><td class="num">${M(r.pv)}</td><td class="num">${M(r.uc)}</td><td class="num">${M(r.wc)}</td><td class="num">${M(r.closeValue)}</td><td>${stPill(MAT_STATUS, r.mat.status)}</td></tr>`).join('')}
        </tbody><tfoot><tr><td class="sticky">Total</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td class="num">${M(T('pv'))}</td><td class="num">${M(T('uc'))}</td><td class="num">${M(T('wc'))}</td><td class="num">${M(T('closeValue'))}</td><td></td></tr></tfoot></table></div>`
        : `<div class="panel empty"><h3>No stock activity in ${esc(fmtMonth(f.month))}</h3><p>Pick another month, or include materials with no activity.</p></div>`}</section>
      <div class="cols section">
        <section class="panel"><div class="panel-head"><h2>Usage by dish or purpose</h2><span class="small muted">${money(usageTotal)} issued</span></div>
          ${usageRows.length ? usageRows.map(([k, u]) => `<div class="kv"><span>${esc(k)} <span class="faint small">${u.n} line${u.n > 1 ? 's' : ''}</span></span><span>${money(u.cost)}</span></div>`).join('') : '<p class="muted">No kitchen issues recorded this month.</p>'}
        </section>
        <section class="panel"><div class="panel-head"><h2>Ingredient price changes</h2><span class="small muted">Latest vs previous delivery</span></div>
          ${changes.length ? changes.slice(0, 25).map(m => `<div class="kv" data-open="mat" data-id="${esc(m.id)}" style="cursor:pointer"><span>${esc(m.name)} <span class="faint small">${money(m.prevCost)} to ${money(m.latestCost)}${usedIn(m.id) ? `, in ${usedIn(m.id)} recipe${usedIn(m.id) > 1 ? 's' : ''}` : ''}</span></span><span>${chg(m.change)}</span></div>`).join('') : '<p class="muted">Price changes show once a material has at least two deliveries on different dates.</p>'}
        </section>
      </div>
      <div class="cols section">
        <section class="panel"><div class="panel-head"><h2>Waste by reason</h2><span class="small muted">${money(wasteTotal)} lost</span></div>
          ${wasteRows.length ? wasteRows.map(([k, w]) => `<div class="kv"><span>${esc(k)} <span class="faint small">${[w.raw ? 'raw ' + money(w.raw) : '', w.dish ? 'dishes ' + money(w.dish) : ''].filter(Boolean).join(', ')}</span></span><span>${money(w.raw + w.dish)}</span></div>`).join('') + (usageTotal + wasteTotal ? `<p class="small muted" style="margin-top:10px">Waste is ${pct(wasteTotal / (usageTotal + wasteTotal))} of everything issued or wasted this month.</p>` : '') : '<p class="muted">No waste recorded this month. Use Forms, then Waste & spoilage.</p>'}
        </section>
        <section class="panel"><div class="panel-head"><h2>Production</h2><span class="small muted">Batches recorded this month</span></div>
          ${prodRows.length ? prodRows.map(([rid, p]) => { const r = model.recById[rid]; const spb = p.servBatches ? p.servings / p.servBatches : null; const std = r ? num(r.standardYield) : null; const yv = spb && std ? (spb - std) / std : null; return `<div class="kv" ${r ? `data-open="recipe" data-id="${esc(rid)}" style="cursor:pointer"` : ''}><span>${esc(r ? r.name : 'Deleted recipe')} <span class="faint small">${qty(p.batches)} batch${p.batches === 1 ? '' : 'es'}${spb ? `, ${qty(spb, 1)} servings each` : ''}</span></span><span>${yv != null ? `<span class="${Math.abs(yv) > model.S.maxYieldVar && yv < 0 ? 'chg-up' : ''}">${signedPct(yv)} vs standard</span>` : money(p.cost)}</span></div>`; }).join('') : '<p class="muted">No production batches recorded this month.</p>'}
        </section>
      </div>`;
  }
};

      if (e.target.closest('[data-save-slipmsg]')) { saveSettingsPatch({ slipFooter: $('[data-slip-footer]', live).value.trim() }).then(r => toast(r === false ? 'No changes to save' : 'Slip message saved')); return; }
      if (e.target.closest('[data-save-biz]')) {

        return;

        ${supRows.map(({ s, st }) => `<tr data-open="supplier" data-id="${esc(s.id)}"><td class="sticky"><span class="name">${esc(s.name)}</span>${pendingTag('suppliers/' + s.id)}</td><td>${esc(s.contact || '')}</td><td class="tnum">${esc(s.phone || '')}</td><td>${esc(s.terms || '')}</td><td class="num">${num(s.leadTime) != null ? qty(num(s.leadTime)) + ' d' : ''}</td><td>${s.category ? catChip(s.category) : ''}</td><td>${st ? esc(fmtDate(st.last)) : '<span class="faint">—</span>'}</td><td class="num">${st ? money(st.total) : '—'}</td><td class="num">${st && st.qN ? (st.qSum / st.qN).toFixed(1) : '—'}</td></tr>`).join('')}

      <section class="section"><div class="panel-head"><h2>Lists</h2></div><div class="panel">

          <div class="chips">${S[k].map((v, i) => `<span class="chip">${esc(v)}<button type="button" data-chip-rm data-list="${k}" data-i="${i}" aria-label="Remove ${esc(v)}" data-write>${ICON.close}</button></span>`).join('')}
          <span class="chip-add" data-write><input type="text" data-chip-in="${k}" placeholder="Add…" aria-label="Add to ${esc(label)}"><button type="button" class="btn ghost sm" data-chip-add data-list="${k}">Add</button></span></div></div>`).join('')}

          <button type="button" class="btn ghost sm" data-save-biz style="margin-top:8px" data-write>Save header</button></div>
        <div style="padding-top:14px"><h3>Currency symbol</h3><div class="chip-add" style="margin-top:8px" data-write><input type="text" data-cur value="${esc(S.currency)}" style="width:80px" aria-label="Currency symbol"><button type="button" class="btn ghost sm" data-save-cur>Save</button></div></div>
      </div></section>
      <div class="cols section">
        <section class="panel"><div class="panel-head"><h2>Your data</h2></div>

};

function customerRows() {
  const q = String(ui.custQ || '').trim().toLowerCase(), d = String(ui.custQ || '').replace(/\D/g, '');
  const rows = model.customers.filter(c => !q || (c.name || '').toLowerCase().includes(q) || (c.address || '').toLowerCase().includes(q) || (d.length >= 3 && String(c.phone || '').replace(/\D/g, '').includes(d)));
  if (!rows.length) return '<tr><td class="sticky" colspan="6"><span class="muted">No customers match.</span></td></tr>';
  return rows.map(c => `<tr data-open="customer" data-id="${esc(c.id)}"><td class="sticky"><span class="name">${esc(c.name || 'No name')}</span>${pendingTag('customers/' + c.id)}</td><td class="tnum nowrap">${esc(c.phone || '')}</td><td class="small" style="max-width:320px">${esc(c.address || '')}</td><td class="num">${c.orders || DASH}</td><td class="num">${c.orders ? money(c.spent) : DASH}</td><td class="nowrap">${c.last ? esc(fmtDate(c.last)) : DASH}</td></tr>`).join('');
}

/* =========================================================
   Material drawer + editor
   ========================================================= */
function openMaterial(id) {
  const s = sheet({
    title: 'Material', drawer: true, body: '',
    onMount(api) { api.update = () => render(api); render(api); }
  });
  s.el.addEventListener('click', e => {
    const a = e.target.closest('[data-mact]');
    if (a) {
      const k = a.dataset.mact;
      if (k === 'receive') openReceive({ materialId: id });
      if (k === 'issue') openIssue({ materialId: id });
      if (k === 'edit') editMaterial(id);
      if (k === 'waste') openWaste({ materialId: id });
      return;
    }
    const r = e.target.closest('[data-goto-recipe]');
    if (r) { s.close(); App.go('recipe', r.dataset.gotoRecipe); }
  });
  resolveNames(s.el);
  function render(api) {
    const m = model.matById[id];
    if (!m) { api.close(); return; }
    $('[data-title]', api.el).textContent = m.name;
    const purchases = m.purchases.slice().reverse();
    const moves = m.moves.slice().reverse().slice(0, 20);
    const used = model.recipes.map(r => ({ r, l: (r.ingredients || []).find(l => l.materialId === id) })).filter(x => x.l);
    $('[data-body]', api.el).innerHTML = `
      <p style="display:flex;gap:14px;flex-wrap:wrap;align-items:center">${catChip(m.category)}<span class="muted">Counted in ${esc(m.unit)}</span>${stPill(MAT_STATUS, m.status)}${m.archived ? '<span class="tape">Archived</span>' : ''}${pendingTag('materials/' + m.id)}</p>
      <div class="actions" data-write>
        <button class="btn" data-mact="receive">${ICON.receive}Receive</button>
        <button class="btn ghost" data-mact="issue">${ICON.issue}Issue</button>
        <button class="btn ghost" data-mact="waste">${ICON.waste}Log waste</button>
        <button class="btn ghost" data-mact="edit">${ICON.edit}Edit</button>
      </div>
      <dl class="facts">
        <div><dt>On hand</dt><dd><b>${qty(m.onHand)}</b> ${esc(m.unit)}</dd></div>
        <div><dt>Minimum / order up to</dt><dd>${num(m.minStock) ? qty(num(m.minStock)) + ' ' + esc(m.unit) : '<span class="faint">Not set</span>'}${num(m.par) ? ` <small>/ ${qty(num(m.par))}</small>` : ''}</dd></div>
        <div><dt>Stock value</dt><dd>${M(m.value)}</dd></div>
        <div><dt>Weighted avg purchase cost</dt><dd>${M(m.wac)}</dd></div>
        <div><dt>Latest purchase</dt><dd>${M(m.latestCost)} ${m.latestDate ? `<small>${esc(fmtDate(m.latestDate))}</small>` : ''}</dd></div>
        <div><dt>Previous purchase</dt><dd>${M(m.prevCost)} ${m.change != null ? chg(m.change) : ''}</dd></div>
        <div><dt>Current quote</dt><dd>${num(m.quote) > 0 ? money(num(m.quote)) + (m.quoteDate ? ` <small>${esc(fmtDate(m.quoteDate))}</small>` : '') : '<span class="faint">None</span>'}</dd></div>
        <div><dt>Price used in recipes</dt><dd><b>${M(m.pricingCost)}</b> <small>${esc(m.priceSource)}</small></dd></div>
        <div><dt>Preferred supplier</dt><dd>${esc(m.supplier || '—')}</dd></div>
        <div><dt>Total purchased</dt><dd>${qty(m.totalPurchased)} ${esc(m.unit)}</dd></div>
      </dl>
      <p class="small faint">Recipes use the current quote first, then the latest purchase cost, then the weighted average.</p>
      ${purchases.length >= 2 ? (() => { const pts = m.purchases.slice(-24).map(p => num(p.unitCost) || 0); return `<div><h3>Unit cost trend</h3>${sparkline(pts)}<div class="spark-cap"><span>Low ${money(Math.min(...pts))}</span><span>last ${pts.length} deliveries</span><span>High ${money(Math.max(...pts))}</span></div></div>`; })() : ''}
      <div><h3 style="margin-bottom:8px">Purchase history</h3>${purchases.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Date</th><th>Supplier</th><th class="num">Qty</th><th class="num">Unit cost</th><th class="num">Value</th><th>Invoice</th></tr></thead><tbody>
        ${purchases.slice(0, 60).map(p => `<tr><td class="tnum">${esc(fmtDate(p.date))}</td><td>${esc(p.supplier || '—')}</td><td class="num">${qty(num(p.qty))}</td><td class="num">${M(num(p.unitCost))}</td><td class="num">${M((num(p.qty) || 0) * (num(p.unitCost) || 0))}</td><td class="small nowrap">${esc(p.invoice || '')}</td></tr>`).join('')}</tbody></table></div>` : '<p class="muted small">No deliveries recorded yet.</p>'}</div>

  const supNames = [...model.suppliers.map(s => s.name), ...model.mats.map(x => x.supplier)];
  const s = sheet({
    title: id ? 'Edit material' : 'New material',

      <label class="f">Name<input type="text" name="name" value="${esc(d.name)}" autofocus></label>

        <label class="f">Order up to (par level)<input inputmode="decimal" name="par" value="${num(d.par) > 0 ? num(d.par) : ''}" placeholder="Optional"><span class="hint">Purchase orders suggest enough to reach this.</span></label>
        <label class="f">Preferred supplier<input type="text" name="supplier" list="dl-msup" value="${esc(d.supplier || '')}" autocomplete="off">${datalist('dl-msup', supNames)}</label>
        <label class="f">Current quote per unit<input inputmode="decimal" name="quote" value="${num(d.quote) > 0 ? num(d.quote) : ''}" placeholder="Optional"><span class="hint">Overrides purchase prices in recipe costing.</span></label>
        <label class="f">Quote date<input type="date" name="quoteDate" value="${esc(d.quoteDate || '')}"></label>

        <div class="grid g2" style="margin-top:10px" data-sellbox ${d.sellable ? '' : 'hidden'}><label class="f">Selling price per ${esc(d.unit || 'unit')}<input inputmode="decimal" name="sellPrice" value="${num(d.sellPrice) > 0 ? num(d.sellPrice) : ''}" placeholder="${m && resaleSuggested(m, S.channels[0]) ? 'Suggested ' + money(resaleSuggested(m, S.channels[0])) : 'Enter price'}"><span class="hint">Leave blank to use the suggested price from your pricing assumptions.</span></label></div></div>
      ${id && m && m.moves.length ? `<p class="small faint" data-unitnote hidden>Past movements were recorded in ${esc(raw.unit)}. Changing the unit doesn't convert them.</p>` : ''}`,
    foot: `${id ? (inUse ? `<button class="btn danger" data-arch>${d.archived ? 'Restore' : 'Archive'}</button>` : `<button class="btn danger" data-del>Delete</button>`) : ''}<span class="grow"></span><button class="btn ghost" data-close>Cancel</button><button class="btn" data-save>${id ? 'Save changes' : 'Add material'}</button>`
  });
  const f = n => s.el.querySelector(`[name="${n}"]`);
  f('sellable').addEventListener('change', () => { s.el.querySelector('[data-sellbox]').hidden = !f('sellable').checked; });
  const un = s.el.querySelector('[data-unitnote]');
  if (un) f('unit').addEventListener('change', () => { un.hidden = f('unit').value === raw.unit; });
  s.el.querySelector('[data-save]').addEventListener('click', async () => {
    const err = s.el.querySelector('[data-err]'); const errs = [];
    $$('[aria-invalid]', s.el).forEach(x => x.removeAttribute('aria-invalid'));
    const name = f('name').value.trim();
    if (!name) { errs.push('Enter a name'); f('name').setAttribute('aria-invalid', 'true'); }
    else if (model.allMats.some(x => x.id !== id && x.name.trim().toLowerCase() === name.toLowerCase())) { errs.push(`"${name}" already exists`); f('name').setAttribute('aria-invalid', 'true'); }
    const minStock = f('minStock').value.trim() === '' ? 0 : num(f('minStock').value);
    if (minStock == null || minStock < 0) { errs.push('Minimum stock must be zero or more'); f('minStock').setAttribute('aria-invalid', 'true'); }
    const sellPrice = f('sellPrice').value.trim() === '' ? null : num(f('sellPrice').value);
    if (f('sellable').checked && sellPrice != null && !(sellPrice > 0)) { errs.push('Selling price must be above zero'); f('sellPrice').setAttribute('aria-invalid', 'true'); }
    const par = f('par').value.trim() === '' ? null : num(f('par').value);
    if (par != null && !(par >= 0)) { errs.push('Par level must be zero or more'); f('par').setAttribute('aria-invalid', 'true'); }
    const quote = f('quote').value.trim() === '' ? null : num(f('quote').value);
    if (quote != null && !(quote >= 0)) { errs.push('Quote must be a number'); f('quote').setAttribute('aria-invalid', 'true'); }
    if (errs.length) { err.hidden = false; err.textContent = errs.join('. ') + '.'; return; }
    const full = { ...d, name, category: f('category').value, unit: f('unit').value, minStock, par: par > 0 ? par : null, sellable: f('sellable').checked, sellPrice: sellPrice > 0 ? sellPrice : null, supplier: f('supplier').value.trim(), quote: quote > 0 ? quote : null, quoteDate: quote > 0 ? (f('quoteDate').value || today()) : null };
    const newId = id || 'm-' + slug(name) + '-' + uid().slice(-4);
    await saveDoc('materials', newId, full, raw);
    toast(id ? 'Material saved' : `${name} added`);
    s.close();
  });
  const arch = s.el.querySelector('[data-arch]');
