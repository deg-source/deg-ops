  const del = s.el.querySelector('[data-del]');
  if (del) del.addEventListener('click', async () => {
    const ok = await confirmSheet({ title: 'Delete material?', message: `${d.name} has no movements and isn't in any recipe, so it can be deleted.`, confirm: 'Delete', danger: true });
    if (!ok) return;
    await deleteDoc('materials', id); toast('Material deleted'); closeMaterialLayers(); s.close();
  });
}
function closeMaterialLayers() { for (const l of openLayers.slice()) if (l.layer.classList.contains('drawer')) l.close(); }

/* =========================================================
   Receive delivery (multi-line purchase)
   ========================================================= */
function lineErr(inp, bad) { if (bad) inp.setAttribute('aria-invalid', 'true'); else inp.removeAttribute('aria-invalid'); return bad; }
function openReceive({ materialId, poId } = {}) {
  if (!model.mats.length) { toast('Add a material first.'); return editMaterial(null); }
  const S = model.S;
  const po = poId ? model.poById[poId] : null;
  if (poId && (!po || !po.lines.some(l => l.remaining > 1e-9))) { toast('Everything on this purchase order has been received.'); return; }
  const supNames = [...model.suppliers.map(x => x.name), ...model.mats.map(m => m.supplier)];
  const s = sheet({
    title: 'Receive delivery', size: 'wide',
    body: `${po ? `<div class="note">Receiving against <b>${esc(po.number)}</b> from ${esc(po.supplier)}. Quantities show what's still outstanding; change them to what actually arrived.</div>` : `<p class="muted small">Record what arrived and what you paid. Stock goes up and the purchase price feeds recipe costing.</p>`}
      <div class="note bad" data-err hidden></div>
      <div class="grid g4">
        <label class="f">Date<input type="date" name="date" value="${today()}" max="${today()}"></label>
        <label class="f">Supplier<input type="text" name="supplier" list="dl-sup" autocomplete="off">${datalist('dl-sup', supNames)}</label>
        <label class="f">Invoice / DR no.<input type="text" name="invoice"></label>
        <label class="f">Received by<select name="staff">${options(S.staff, '', 'Choose…')}</select></label>
      </div>
      <div class="lines" data-lines></div>
      <button type="button" class="btn ghost sm" data-add>${ICON.plus}Add item</button>
      <details class="more-fields"><summary>Quality, lead time and remarks</summary>
        <div class="grid g3"><label class="f">Quality (1 to 5)<select name="quality"><option value="">—</option>${[5, 4, 3, 2, 1].map(n => `<option>${n}</option>`).join('')}</select></label>
        <label class="f">Lead time (days)<input inputmode="numeric" name="leadTime"></label>
        <label class="f">Remarks<input type="text" name="remarks"></label></div></details>`,
    foot: `<div class="grow">Delivery total <b data-total>${money(0)}</b></div><button class="btn ghost" data-close>Cancel</button><button class="btn" data-save>Save delivery</button>`
  });
  const box = s.el.querySelector('[data-lines]');
  const f = n => s.el.querySelector(`[name="${n}"]`);
  function addLine(mid = '', q = '', c = '', poLine = '') {
    const div = document.createElement('div');
    div.className = 'line rcv'; div.dataset.line = ''; if (poLine) { div.dataset.poLine = poLine; div.dataset.poMat = mid; }
    div.innerHTML = `<label class="f f-mat"><span class="lbl">Item</span><select data-k="mat">${matOptions(mid)}</select></label>
      <label class="f f-qty"><span class="lbl">Quantity</span><span class="unitbox"><input inputmode="decimal" data-k="qty" placeholder="0" value="${esc(q)}"><span data-unit>${esc(unitOf(mid))}</span></span></label>
      <label class="f f-cost"><span class="lbl">Unit cost</span><input inputmode="decimal" data-k="cost" placeholder="0.00" value="${esc(c)}"></label>
      <label class="f f-total"><span class="lbl">Line total</span><input inputmode="decimal" data-k="total" placeholder="0.00"></label>
      <button type="button" class="icon-btn" data-remove aria-label="Remove item">${ICON.trash}</button>`;
    box.appendChild(div);
    if (mid) onMat(div);
    return div;
  }
  function onMat(line) {
    const m = model.matById[line.querySelector('[data-k="mat"]').value];
    line.querySelector('[data-unit]').textContent = m ? m.unit : '';
    const cost = line.querySelector('[data-k="cost"]');
    if (m && !cost.value) { const c = m.latestCost || m.pricingCost; if (c) cost.value = +c.toFixed(2); }
    if (m && m.supplier && !f('supplier').value) f('supplier').value = m.supplier;
    recalc(line, 'cost');
  }
  function recalc(line, from) {
    const q = num(line.querySelector('[data-k="qty"]').value);
    const c = line.querySelector('[data-k="cost"]'), t = line.querySelector('[data-k="total"]');
    if (from === 'total') { const tv = num(t.value); if (q > 0 && tv != null) c.value = +(tv / q).toFixed(4); }
    else { const cv = num(c.value); t.value = q != null && cv != null ? +(q * cv).toFixed(2) : ''; }
    total();
  }
  function total() {
    let sum = 0; $$('[data-line]', box).forEach(l => { sum += (num(l.querySelector('[data-k="qty"]').value) || 0) * (num(l.querySelector('[data-k="cost"]').value) || 0); });
    s.el.querySelector('[data-total]').textContent = money(sum);
  }
  if (po) {
    f('supplier').value = po.supplier || '';
    for (const l of po.lines) if (l.remaining > 1e-9 && l.m) addLine(l.materialId, String(+l.remaining.toFixed(4)), num(l.unitCost) != null ? String(num(l.unitCost)) : '', l.id);
    $$('[data-line]', box).forEach(l => recalc(l, 'cost'));
  } else { addLine(materialId || ''); if (!materialId) addLine(); }
  s.el.querySelector('[data-add]').addEventListener('click', () => { addLine().querySelector('select').focus(); });
  box.addEventListener('change', e => { if (e.target.matches('[data-k="mat"]')) onMat(e.target.closest('[data-line]')); });
  box.addEventListener('input', e => { const k = e.target.dataset.k; if (k === 'qty' || k === 'cost' || k === 'total') recalc(e.target.closest('[data-line]'), k); });
  box.addEventListener('click', e => { const b = e.target.closest('[data-remove]'); if (b) { b.closest('[data-line]').remove(); if (!box.children.length) addLine(); total(); } });
  s.el.querySelector('[data-save]').addEventListener('click', async () => {
    const err = s.el.querySelector('[data-err]'); const errs = [];
    const date = f('date').value;
    if (lineErr(f('date'), !date)) errs.push('Choose a date');
    const lines = [];
    for (const l of $$('[data-line]', box)) {
      const sel = l.querySelector('[data-k="mat"]'), qi = l.querySelector('[data-k="qty"]'), ci = l.querySelector('[data-k="cost"]');
      if (!sel.value && !qi.value && !ci.value) { [sel, qi, ci].forEach(x => lineErr(x, false)); continue; }
      const q = num(qi.value), c = num(ci.value);
      const b1 = lineErr(sel, !sel.value), b2 = lineErr(qi, !(q > 0)), b3 = lineErr(ci, c == null || c < 0);
      if (b1 || b2 || b3) { errs.push('Each item needs a material, a quantity above zero and a unit cost'); continue; }
      lines.push({ m: model.matById[sel.value], q, c, poLineId: l.dataset.poLine && l.dataset.poMat === sel.value ? l.dataset.poLine : null });
    }
    if (!lines.length && !errs.length) errs.push('Add at least one item');
    if (errs.length) { err.hidden = false; err.textContent = [...new Set(errs)].join('. ') + '.'; return; }
    const supplier = f('supplier').value.trim();
    const common = { date, supplier, invoice: f('invoice').value.trim(), staff: f('staff').value, quality: num(f('quality').value), leadTime: num(f('leadTime').value), remarks: f('remarks').value.trim() };
    const at = new Date().toISOString();
    const poRef = po ? { poId: po.id, poNumber: po.number } : {};
    await addEntries(lines.map(({ m, q, c, poLineId }) => ({ id: uid('e'), type: 'purchase', materialId: m.id, qty: q, unitCost: c, unit: m.unit, ...common, ...(po && poLineId ? { ...poRef, poLineId } : {}), by: ME.id || null, at })));
    if (po && po.status === 'draft' && view.pos[po.id]) await saveDoc('pos', po.id, { ...clone(view.pos[po.id]), status: 'sent' }, view.pos[po.id]);
    if (supplier && !model.suppliers.some(x => x.name.trim().toLowerCase() === supplier.toLowerCase())) {
      await saveDoc('suppliers', 's-' + slug(supplier) + '-' + uid().slice(-4), { name: supplier, category: lines[0].m.category || '', leadTime: common.leadTime }, null);
    }
    toast(lines.length === 1 ? `Received ${qty(lines[0].q)} ${lines[0].m.unit} of ${lines[0].m.name}` : `Delivery saved: ${lines.length} items`);
    s.close();
  });
}

/* =========================================================
   Issue to kitchen (with "fill from recipe")
   ========================================================= */
function openIssue({ materialId, recipeId } = {}) {
  if (!model.mats.length) { toast('Add a material first.'); return editMaterial(null); }
  const S = model.S;
  let fromRecipe = recipeId || null;
  const s = sheet({
    title: 'Issue to kitchen', size: 'wide',
    body: `<p class="muted small">Record stock taken out of the storeroom. Food cost uses each material's current average cost.</p>
      <div class="note bad" data-err hidden></div>
      <div class="grid g3">
        <label class="f">Date<input type="date" name="date" value="${today()}" max="${today()}"></label>
        <label class="f">Issued to<select name="staff">${options(S.staff, '', 'Choose…')}</select></label>
        <label class="f">Dish or purpose<input type="text" name="purpose" list="dl-purp" autocomplete="off">${datalist('dl-purp', [...model.recipes.map(r => r.name), ...S.purposes])}</label>
      </div>
      ${model.recipes.length ? `<div class="fill"><label class="f">Fill from a recipe<select name="recipe"><option value="">Choose recipe…</option>${model.recipes.map(r => `<option value="${esc(r.id)}"${r.id === recipeId ? ' selected' : ''}>${esc(r.name)}</option>`).join('')}</select></label>
        <label class="f qty">Batches<input inputmode="decimal" name="batches" value="1"></label>
        <button type="button" class="btn ghost" data-fill>Add ingredients</button></div>` : ''}
      <div class="note warn" data-fillnote hidden></div>
      <div class="lines" data-lines></div>
      <button type="button" class="btn ghost sm" data-add>${ICON.plus}Add item</button>
      <label class="f">Remarks<input type="text" name="remarks"></label>`,
    foot: `<div class="grow">Food cost <b data-total>${money(0)}</b></div><button class="btn ghost" data-close>Cancel</button><button class="btn" data-save>Save issue</button>`
  });
  const box = s.el.querySelector('[data-lines]');
  const f = n => s.el.querySelector(`[name="${n}"]`);
  function addLine(mid = '', q = '') {
    const div = document.createElement('div');
    div.className = 'line iss'; div.dataset.line = '';
    div.innerHTML = `<label class="f f-mat"><span class="lbl">Item</span><select data-k="mat">${matOptions(mid)}</select></label>
      <label class="f f-qty"><span class="lbl">Quantity</span><span class="unitbox"><input inputmode="decimal" data-k="qty" placeholder="0" value="${esc(q)}"><span data-unit>${esc(unitOf(mid))}</span></span></label>
      <div class="hint" data-onhand></div>
      <button type="button" class="icon-btn" data-remove aria-label="Remove item">${ICON.trash}</button>`;
    box.appendChild(div); hint(div);
    return div;
  }
  function hint(line) {
    const m = model.matById[line.querySelector('[data-k="mat"]').value];
    line.querySelector('[data-unit]').textContent = m ? m.unit : '';
    const h = line.querySelector('[data-onhand]');
    const q = num(line.querySelector('[data-k="qty"]').value) || 0;
    if (!m) { h.textContent = ''; h.classList.remove('bad'); }
    else { const over = q > m.onHand + 1e-9; h.textContent = `${over ? 'More than' : ''} ${qty(m.onHand)} ${m.unit} on hand`.trim(); h.classList.toggle('bad', over); if (over) h.textContent = `More than the ${qty(m.onHand)} ${m.unit} on hand`; }
    total();
  }
  function total() {
    let sum = 0; $$('[data-line]', box).forEach(l => { const m = model.matById[l.querySelector('[data-k="mat"]').value]; if (m) sum += (num(l.querySelector('[data-k="qty"]').value) || 0) * (m.bookCost || 0); });
    s.el.querySelector('[data-total]').textContent = money(sum);
  }
  function fill() {
    const r = model.recById[f('recipe').value]; if (!r) { toast('Choose a recipe first.'); return; }
    const b = num(f('batches').value);
    if (!(b > 0)) { f('batches').setAttribute('aria-invalid', 'true'); return; }
    f('batches').removeAttribute('aria-invalid');
    $$('[data-line]', box).forEach(l => { if (!l.querySelector('[data-k="mat"]').value && !l.querySelector('[data-k="qty"]').value) l.remove(); });
    const skipped = [];
    for (const l of r.rc.lines) {
      if (!l.m || l.qtyInv == null) { skipped.push(l.name); continue; }
      if (l.m.archived) { skipped.push(l.name); continue; }
      addLine(l.materialId, String(+(l.qtyInv * b).toFixed(4)));
    }
    if (!f('purpose').value) f('purpose').value = r.name;
    fromRecipe = r.id;
    const note = s.el.querySelector('[data-fillnote]');
    note.hidden = !skipped.length; note.textContent = skipped.length ? `Not added because the unit doesn't convert to stock units: ${skipped.join(', ')}.` : '';
    if (!box.children.length) addLine();
  }
  if (recipeId && model.recById[recipeId]) fill();
  else { addLine(materialId || ''); if (!materialId) addLine(); }
  const fb = s.el.querySelector('[data-fill]'); if (fb) fb.addEventListener('click', fill);
  s.el.querySelector('[data-add]').addEventListener('click', () => { addLine().querySelector('select').focus(); });
  box.addEventListener('change', e => { if (e.target.matches('[data-k="mat"]')) hint(e.target.closest('[data-line]')); });
  box.addEventListener('input', e => { if (e.target.dataset.k === 'qty') hint(e.target.closest('[data-line]')); });
  box.addEventListener('click', e => { const b = e.target.closest('[data-remove]'); if (b) { b.closest('[data-line]').remove(); if (!box.children.length) addLine(); total(); } });
  s.el.querySelector('[data-save]').addEventListener('click', async () => {
    const err = s.el.querySelector('[data-err]'); const errs = [];
    const date = f('date').value;
    if (lineErr(f('date'), !date)) errs.push('Choose a date');
    const lines = [];
    for (const l of $$('[data-line]', box)) {
      const sel = l.querySelector('[data-k="mat"]'), qi = l.querySelector('[data-k="qty"]');
      if (!sel.value && !qi.value) continue;
      const q = num(qi.value);
      const b1 = lineErr(sel, !sel.value), b2 = lineErr(qi, !(q > 0));
      if (b1 || b2) { errs.push('Each item needs a material and a quantity above zero'); continue; }
      lines.push({ m: model.matById[sel.value], q });
    }
    if (!lines.length && !errs.length) errs.push('Add at least one item');
    if (errs.length) { err.hidden = false; err.textContent = [...new Set(errs)].join('. ') + '.'; return; }
    const at = new Date().toISOString();
    const purpose = f('purpose').value.trim();
    const rid = fromRecipe && model.recById[fromRecipe] && model.recById[fromRecipe].name === purpose ? fromRecipe : null;
    await addEntries(lines.map(({ m, q }) => ({ id: uid('e'), type: 'issue', date, materialId: m.id, qty: q, unitCost: m.bookCost || 0, unit: m.unit, staff: f('staff').value, purpose, recipeId: rid, remarks: f('remarks').value.trim(), by: ME.id || null, at })));
    toast(lines.length === 1 ? `Issued ${qty(lines[0].q)} ${lines[0].m.unit} of ${lines[0].m.name}` : `Issue saved: ${lines.length} items`);
    s.close();
  });
}

/* =========================================================
   Stock count (physical count -> adjustments)
   ========================================================= */
function openCount() {
  if (!model.mats.length) { toast('Add a material first.'); return editMaterial(null); }
  const S = model.S;
  const counted = {};
  const st = { q: '', cat: '' };
  const cats = [...new Set(model.mats.map(m => m.category || 'Other'))].sort(catSorter(S.materialCategories));
  const s = sheet({
    title: 'Count stock', size: 'wide',
    body: `<p class="muted small">Enter what's physically on the shelf. Only items you fill in are adjusted; the difference is logged as a count adjustment.</p>
      <div class="note bad" data-err hidden></div>
      <div class="grid g3">
        <label class="f">Count date<input type="date" name="date" value="${today()}" max="${today()}"></label>
        <label class="f">Counted by<select name="staff">${options(S.staff, '', 'Choose…')}</select></label>
        <label class="f">Remarks<input type="text" name="remarks" placeholder="e.g. Month-end count"></label>
      </div>
      <div class="toolbar" style="margin:0"><div class="search"><input type="search" data-cq placeholder="Find material" aria-label="Find material"></div>
        <select data-ccat aria-label="Category">${options(cats, '', 'All categories')}</select></div>
      <div data-rows></div>`,
    foot: `<div class="grow" data-changed>No changes yet</div><button class="btn ghost" data-close>Cancel</button><button class="btn" data-save>Save count</button>`
  });
  const rowsEl = s.el.querySelector('[data-rows]');
  function render() {
    const q = st.q.toLowerCase();
    const list = model.mats.filter(m => (!st.cat || (m.category || 'Other') === st.cat) && (!q || m.name.toLowerCase().includes(q)));
    rowsEl.innerHTML = list.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th class="sticky">Material</th><th>Category</th><th class="num">System</th><th class="num" style="min-width:120px">Counted</th><th class="num">Difference</th></tr></thead><tbody>
      ${list.map(m => `<tr><td class="sticky"><span class="name">${esc(m.name)}</span></td><td>${catChip(m.category)}</td><td class="num">${qty(m.onHand)} <span class="faint">${esc(m.unit)}</span></td>
        <td class="num"><input inputmode="decimal" data-cid="${esc(m.id)}" value="${esc(counted[m.id] ?? '')}" style="text-align:right" aria-label="Counted ${esc(m.name)} in ${esc(m.unit)}"></td>
        <td class="num" data-diff="${esc(m.id)}">${diffCell(m)}</td></tr>`).join('')}</tbody></table></div>` : '<p class="muted">No materials match.</p>';
  }
  function diffCell(m) {
    const v = counted[m.id]; if (v == null || v === '') return '<span class="faint">—</span>';
    const n = num(v); if (n == null || n < 0) return '<span class="st bad">Check</span>';
    const d = n - m.onHand;
    return Math.abs(d) < 1e-9 ? '<span class="faint">No change</span>' : `<span class="${d > 0 ? 'chg-down' : 'chg-up'}">${d > 0 ? '+' : ''}${qty(d)}</span>`;
  }
  function changes() { return Object.entries(counted).filter(([id, v]) => { const n = num(v); const m = model.matById[id]; return v !== '' && n != null && n >= 0 && m && Math.abs(n - m.onHand) > 1e-9; }); }
  function foot() { const c = changes().length; s.el.querySelector('[data-changed]').textContent = c ? `${c} item${c > 1 ? 's' : ''} will be adjusted` : 'No changes yet'; }
  render();
  s.el.querySelector('[data-cq]').addEventListener('input', e => { st.q = e.target.value; render(); });
  s.el.querySelector('[data-ccat]').addEventListener('change', e => { st.cat = e.target.value; render(); });
  rowsEl.addEventListener('input', e => {
    const id = e.target.dataset.cid; if (!id) return;
    counted[id] = e.target.value.trim();
    const cell = rowsEl.querySelector(`[data-diff="${CSS.escape(id)}"]`); if (cell) cell.innerHTML = diffCell(model.matById[id]);
    foot();
  });
  s.el.querySelector('[data-save]').addEventListener('click', async () => {
    const err = s.el.querySelector('[data-err]');
    const bad = Object.entries(counted).filter(([, v]) => v !== '' && !(num(v) >= 0));
    if (bad.length) { err.hidden = false; err.textContent = 'Counted quantities must be zero or more.'; return; }
    const ch = changes();
    if (!ch.length) { err.hidden = false; err.textContent = 'Nothing to adjust. Enter a counted quantity that differs from the system quantity.'; return; }
    const date = s.el.querySelector('[name="date"]').value || today();
    const staff = s.el.querySelector('[name="staff"]').value, remarks = s.el.querySelector('[name="remarks"]').value.trim();
    const at = new Date().toISOString();
    await addEntries(ch.map(([id, v]) => { const m = model.matById[id]; const n = num(v); return { id: uid('e'), type: 'adjust', date, materialId: id, qty: +(n - m.onHand).toFixed(6), unitCost: m.bookCost || 0, unit: m.unit, staff, purpose: 'Physical count', counted: n, systemQty: m.onHand, remarks, by: ME.id || null, at }; }));
    toast(`Count saved: ${ch.length} item${ch.length > 1 ? 's' : ''} adjusted`);
    s.close();
  });
}

async function voidEntry(day, id) {
  const e = model.log.find(x => x.id === id && x.day === day) || model.log.find(x => x.id === id);
  if (!e) return;
  const m = model.matById[e.materialId], r = e.recipeId ? model.recById[e.recipeId] : null;
  const linked = e.type === 'production' ? model.entries.filter(x => x.productionId === e.id && !x.void) : [];
  const what = e.type === 'production' ? `Production of ${r ? r.name : 'a recipe'} (${qty(num(e.batches))} batch${num(e.batches) === 1 ? '' : 'es'})`
    : !e.materialId ? `${TYPES[e.type]}: ${qty(num(e.qty))} servings of ${r ? r.name : 'a recipe'}`
    : `${TYPES[e.type]}: ${qty(num(e.qty))} ${e.unit || ''} of ${m ? m.name : 'material'}`;
  const reason = await confirmSheet({
    title: 'Void this entry?',
    message: `${what} on ${fmtDate(e.date)}.${linked.length ? ` The ${linked.length} ingredient issue${linked.length > 1 ? 's' : ''} logged with it will be voided too, returning that stock.` : ''} Voided entries stay in the history, crossed out, and stop counting toward stock and costs.`,
    confirm: 'Void entry', danger: true, input: 'Reason (optional)'
  });
  if (reason === null) return;
  const patch = { void: true, voidBy: ME.id || null, voidAt: new Date().toISOString(), voidReason: reason || '' };
  await enqueue([e, ...linked].map(x => ({ op: 'txnPatch', day: x.day, id: x.id, data: sanitize(patch) })));
  toast(linked.length ? `Entry and ${linked.length} linked issue${linked.length > 1 ? 's' : ''} voided` : 'Entry voided');
}

function nextRecipeCode(cat) {
  const pre = 'R-' + (String(cat || 'GEN').replace(/[^A-Za-z]/g, '').slice(0, 4).toUpperCase() || 'GEN') + '-';
  let n = 0;
  for (const r of model.recipes) if (String(r.code || '').startsWith(pre)) n = Math.max(n, parseInt(String(r.code).slice(pre.length), 10) || 0);
  return pre + String(n + 1).padStart(3, '0');
}

  const box = s.el.querySelector('[data-lines]');

  function addLine(mid = '', q = '', c = '', lid = '') {

    if (!cands.length) { toast(sup ? `No items at minimum have ${supRaw} as their preferred supplier.` : 'No items are at or below their minimum right now.'); return; }
    $$('[data-line]', box).forEach(l => { if (!l.querySelector('[data-k="mat"]').value && !l.querySelector('[data-k="qty"]').value) l.remove(); });
    for (const m of cands) { const c = m.latestCost || m.pricingCost; addLine(m.id, String(suggestQty(m)), c ? String(+c.toFixed(2)) : ''); }

  if (raw) (d.lines || []).forEach(l => addLine(l.materialId, num(l.qty) != null ? String(num(l.qty)) : '', num(l.unitCost) != null ? String(num(l.unitCost)) : '', l.id));

  box.addEventListener('input', e => { if (e.target.dataset.k === 'qty' || e.target.dataset.k === 'cost') recalc(e.target.closest('[data-line]')); });
  box.addEventListener('click', e => { const b = e.target.closest('[data-remove]'); if (b) { b.closest('[data-line]').remove(); if (!box.children.length) addLine(); recalc(box.firstElementChild); } });
  async function save(andPdf) {

      if (!sel.value && !qi.value && !ci.value) continue;

      const b1 = lineErr(sel, !sel.value), b2 = lineErr(qi, !(q > 0)), b3 = lineErr(ci, ci.value.trim() !== '' && !(c >= 0));
      if (b1 || b2 || b3) { errs.push('Each item needs a material and a quantity above zero'); continue; }

    const newId = id || 'po-' + uid();

      const m0 = model.matById[lines[0].materialId];

      if (!ok) return;

    } else {

    }
    s.close();
  });
}

  const s = sheet({
    title: 'Record waste', size: 'wide',
    body: `<div class="seg" role="group" aria-label="What was wasted" data-mode><button type="button" data-m="raw">Raw materials</button><button type="button" data-m="dish">Prepared dish</button></div>

        <label class="f">Logged by<select name="staff">${options(S.staff, '', 'Choose…')}</select></label>

      <label class="f">Remarks<input type="text" name="remarks" placeholder="What happened"></label>`,

  const f = n => s.el.querySelector(`[name="${n}"]`);

  }
  function addLine(mid = '') {
    const div = document.createElement('div');
    div.className = 'line iss'; div.dataset.line = '';
    div.innerHTML = `<label class="f f-mat"><span class="lbl">Item</span><select data-k="mat">${matOptions(mid)}</select></label>
      <label class="f f-qty"><span class="lbl">Quantity</span><span class="unitbox"><input inputmode="decimal" data-k="qty" placeholder="0"><span data-unit>${esc(unitOf(mid))}</span></span></label>
      <div class="hint" data-cost></div>
      <button type="button" class="icon-btn" data-remove aria-label="Remove item">${ICON.trash}</button>`;
    box.appendChild(div); hint(div); return div;

  function hint(line) {

  f('recipe').addEventListener('change', total); f('servings').addEventListener('input', total);

    const err = s.el.querySelector('[data-err]'); const errs = [];

    const common = { date, reason: f('reason').value, staff: f('staff').value, remarks: f('remarks').value.trim(), by: ME.id || null, at: new Date().toISOString() };
    let entries = [];
    if (mode === 'raw') {
      for (const l of $$('[data-line]', box)) {

      if (lineErr(f('recipe'), !r)) errs.push('Choose the dish');

    }

    await addEntries(entries);
    const loss = entries.reduce((a, e) => a + e.qty * e.unitCost, 0);

    s.close();
  });

function resaleSuggested(m, ch) {
  const rc = { ready: m.pricingCost > 0, costPerServing: m.pricingCost || 0 };
  const p = priceFor(rc, { packaging: 0, otherFixed: 0 }, ch, model.S);

function posCatalog() {
  const S = model.S;
  let ci = S.channels.findIndex(c => c.id === Cart.channel);
  if (ci < 0) { ci = 0; Cart.channel = S.channels[0].id; }
  const ch = S.channels[ci];
  const items = [];
  for (const r of model.recipes) {
    if (r.onMenu === false) continue;
    const order = r.stockMode === 'order';
    for (const z of r.sz) {
      const menu = num(z.menuPrices[ch.id]); const p = z.prices[ci];
      const price = menu > 0 ? menu : p && p.ok ? p.rounded : null;
      const left = order ? null : Math.floor(((r.fg ? r.fg.onHand : 0) + 1e-9) / (z.factor || 1));
      items.push({ key: `r:${r.id}:${z.id}`, kind: 'recipe', r, z, name: r.name, size: r.sz.length > 1 ? z.name : '', category: r.category || 'Other', price, left, order, factor: z.factor || 1 });
    }
  }
  for (const m of model.mats) {
    if (!m.sellable) continue;
    const price = num(m.sellPrice) > 0 ? num(m.sellPrice) : resaleSuggested(m, ch);
    items.push({ key: `m:${m.id}`, kind: 'resale', m, name: m.name, size: '', category: m.category || 'Other', price, left: Math.floor(m.onHand + 1e-9), unit: m.unit });

  const rowsB = bk.list.map((b, i) => [b.label, A.byBucket[b.key], bStart(b, i)]).filter(([, x, st]) => (bk.kind === 'hour' ? !!x : st <= P.effEnd));
  pdfHeading(ctx, bk.title);
  pdfTable(ctx, [bk.kind[0].toUpperCase() + bk.kind.slice(1), 'Orders', 'Net sales', 'Gross profit'], rowsB.map(([l, x]) => [l, x ? x.orders : 0, money(x ? x.net : 0), money(x ? x.gp : 0)]),
    { rowH: 15, columnStyles: { 1: R, 2: R, 3: R } });
  if (items.length) {
    pdfHeading(ctx, 'Best items');
    pdfTable(ctx, ['#', 'Item', 'Category', 'Qty', 'Sales', 'Share', 'Gross profit', 'Margin'], items.slice(0, 20).map((x, i) => [i + 1, x.name + (x.size ? ' ' + x.size : ''), x.cat, qty(x.qty), money(x.net), pct(A.net ? x.net / A.net : 0), money(x.gp), x.margin != null ? pct(x.margin) : '']),
      { rowH: 16, columnStyles: { 0: NUMCOL, 3: R, 4: R, 5: R, 6: R, 7: R } });
  }
  const small = (title, mp, key, fmtK = k => k) => { const e = Object.entries(mp).sort((a, b) => b[1].net - a[1].net); if (!e.length) return; pdfHeading(ctx, title); pdfTable(ctx, [key, 'Orders', 'Amount', 'Share'], e.map(([k, v]) => [fmtK(k), v.orders, money(v.net), pct(A.net ? v.net / A.net : 0)]), { rowH: 15, columnStyles: { 1: R, 2: R, 3: R } }); };
  const cats = Object.entries(A.cats).sort((a, b) => b[1].net - a[1].net);
  if (cats.length) { pdfHeading(ctx, 'By category'); pdfTable(ctx, ['Category', 'Qty', 'Sales', 'Share'], cats.map(([k, v]) => [k, qty(v.qty), money(v.net), pct(A.net ? v.net / A.net : 0)]), { rowH: 15, columnStyles: { 1: R, 2: R, 3: R } }); }
  small('By channel', A.channels, 'Channel'); small('By payment', A.pays, 'Payment'); small('By cashier', A.staff, 'Cashier', k => names[k]);
  if (A.cust.rows.length) { pdfHeading(ctx, 'Top customers'); pdfTable(ctx, ['Customer', 'Contact', 'Orders', 'Spent', 'Last order'], A.cust.rows.slice(0, 10).map(r => [(r.c.name || '') + (r.isNew ? ' (new)' : ''), r.c.phone || '', r.orders, money(r.net), fmtDate(r.last)]), { rowH: 15, columnStyles: { 2: R, 3: R } }); }
  if (P.gran === 'day') {
    const orders = model.sales.filter(s => s.date === P.start);
    if (orders.length) { pdfHeading(ctx, 'Orders'); pdfTable(ctx, ['Time', 'Order', 'Customer', 'Items', 'Paid by', 'Total'], orders.map(s => [fmtTime(s.at), (s.receipt || '') + (s.void ? ' VOID' : ''), (s.customer && (s.customer.name || s.customer.phone)) || '', (s.items || []).map(it => `${qty(num(it.qty))} ${it.name}${it.size ? ' ' + it.size : ''}`).join(', '), s.payment || '', money(num(s.total))]), { rowH: 15, columnStyles: { 0: { cellWidth: 50 }, 1: { cellWidth: 70 }, 5: { halign: 'right', cellWidth: 70 } } }); }
  }
  if (A.voids.count) pdfParagraph(ctx, `${A.voids.count} voided order${A.voids.count > 1 ? 's' : ''} totalling ${money(A.voids.amount)} are not included above.`);
  await pdfFinish(ctx, `sales-report-${slug(P.label)}.pdf`);
}

/* =========================================================
   Boot
   ========================================================= */
(async function boot() {
  await loadLocal();
  rebuildNow();
  App.start();
  App.renderSync();
  connect();
})();

</script>
